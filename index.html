<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biologija 2 – videopredavanja</title>
<meta name="description" content="Interaktivna videopredavanja iz Biologije (2. kolokvij) s animiranim dijagramima, pripovijedanjem i pitanjima.">
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1d1b18; --muted:#615c54; --line:#e2ddd2;
  --accent:#0f766e; --accentInk:#ffffff; --soft:#eef6f4;
  --dna1:#3b82f6; --dna2:#1e3a8a; --rna:#ea580c; --enz:#16a34a; --tf:#7c3aed; --tfFill:#7c3aed;
  --sn:#0d9488; --snFill:#0f766e; --cap:#db2777; --capFill:#be185d; --hl:#dc2626; --el:#d97706;
  --mir:#c026d3; --histone:#a8a29e; --exFill:#ea580c; --intron:#c2a58a; --ph:#eab308;
  --ok:#15803d; --okBg:#e8f6ec; --bad:#b91c1c; --badBg:#fdecec; --addBg:#fff8e6; --addLine:#d9a400;
  --svgbg:#ffffff; --cell:#f3efe6;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13120f; --card:#1e1c18; --ink:#f2eee6; --muted:#b0a99d; --line:#363129;
    --accent:#2dd4bf; --accentInk:#0b1a18; --soft:#16302c;
    --dna1:#7dd3fc; --dna2:#3b82f6; --rna:#fb923c; --enz:#4ade80; --tf:#a78bfa; --tfFill:#6d28d9;
    --sn:#2dd4bf; --snFill:#0f766e; --cap:#f472b6; --capFill:#be185d; --hl:#f87171; --el:#fbbf24;
    --mir:#e879f9; --histone:#78716c; --exFill:#c2410c; --intron:#8a7462; --ph:#facc15;
    --ok:#4ade80; --okBg:#12301d; --bad:#fca5a5; --badBg:#3a1616; --addBg:#2d2610; --addLine:#d9a400;
    --svgbg:#1e1c18; --cell:#26231e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13120f; --card:#1e1c18; --ink:#f2eee6; --muted:#b0a99d; --line:#363129;
  --accent:#2dd4bf; --accentInk:#0b1a18; --soft:#16302c;
  --dna1:#7dd3fc; --dna2:#3b82f6; --rna:#fb923c; --enz:#4ade80; --tf:#a78bfa; --tfFill:#6d28d9;
  --sn:#2dd4bf; --snFill:#0f766e; --cap:#f472b6; --capFill:#be185d; --hl:#f87171; --el:#fbbf24;
  --mir:#e879f9; --histone:#78716c; --exFill:#c2410c; --intron:#8a7462; --ph:#facc15;
  --ok:#4ade80; --okBg:#12301d; --bad:#fca5a5; --badBg:#3a1616; --addBg:#2d2610; --addLine:#d9a400;
  --svgbg:#1e1c18; --cell:#26231e;
  color-scheme: dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 48px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .in{max-width:560px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:8px}
header.top h1{font-size:17px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{min-width:44px;min-height:44px;border:1px solid var(--line);background:var(--card);border-radius:12px;cursor:pointer;padding:0 10px}
.btn{min-height:46px;border:0;border-radius:12px;padding:0 16px;background:var(--accent);color:var(--accentInk);font-weight:650;cursor:pointer}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0}
.muted{color:var(--muted)}
h2{font-size:21px;line-height:1.25;margin:14px 0 6px}
h3{font-size:18px;margin:6px 0}
.lec{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit}
.lec .num{flex:none;width:52px;height:52px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-weight:800;color:var(--accent)}
.lec.dis{opacity:.55}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:40px;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-weight:700;text-decoration:none;color:inherit;padding:0 10px;font-size:15px}
.chip.cur{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
.chip.done{border-color:var(--ok);color:var(--ok)}
.chip.cur.done{color:var(--accentInk)}
.chip.lock{opacity:.4;pointer-events:none}
.stage{background:var(--svgbg);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.stage svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:14px;color:var(--muted);margin:8px 2px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{display:inline-block;width:18px;height:6px;border-radius:3px}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0 4px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.txt{min-height:150px;transition:opacity .25s}
.txt.fade{opacity:.15}
.txt p{margin:.3em 0 .6em}
.add{display:block;background:var(--addBg);border-left:4px solid var(--addLine);padding:8px 10px;border-radius:8px;margin:8px 0;font-size:16px}
.mn{display:block;background:var(--soft);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:16px}
.ctrl{display:grid;grid-template-columns:1fr 1.25fr auto 1fr;gap:8px;margin-top:8px}
.ctrl .btn{padding:0 6px;white-space:nowrap;font-size:15px}
.note{font-size:14px;color:var(--muted);margin-top:8px}
.q .opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);cursor:pointer;min-height:48px}
.q .opt.ok{border-color:var(--ok);background:var(--okBg)}
.q .opt.bad{border-color:var(--bad);background:var(--badBg)}
.q .opt:disabled{cursor:default}
.fb{border-radius:12px;padding:10px 12px;margin-top:8px;font-size:16px}
.fb.ok{background:var(--okBg);border:1px solid var(--ok)}
.fb.bad{background:var(--badBg);border:1px solid var(--bad)}
.q input{width:100%;min-height:48px;font:inherit;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.row .btn{flex:1}
.hidden{display:none !important}
ul.sum{padding-left:20px} ul.sum li{margin:6px 0}
.score{font-size:22px;font-weight:800}
/* SVG */
.l{fill:var(--ink);font-size:12px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.s{font-size:10.5px}.b{font-weight:700}.w{fill:#fff}.m{fill:var(--muted)}
.cR{fill:var(--rna)}.cB{fill:var(--dna1)}.cB2{fill:var(--dna2)}.cG{fill:var(--enz)}.cP{fill:var(--tf)}.cH{fill:var(--hl)}.cT{fill:var(--sn)}.cK{fill:var(--cap)}.cM{fill:var(--mir)}
.cd{stroke:var(--dna1);stroke-width:4;fill:none;stroke-linecap:round}
.ct{stroke:var(--dna2);stroke-width:4;fill:none;stroke-linecap:round}
.rn{stroke:var(--rna);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.intr{stroke:var(--intron);stroke-width:4;fill:none;stroke-linecap:round}
.gr{stroke:var(--muted);stroke-width:1.2;opacity:.55}
.ez{fill:var(--enz);fill-opacity:.28;stroke:var(--enz);stroke-width:2}
.tff{fill:var(--tfFill)}
.snf{fill:var(--snFill)}
.cpf{fill:var(--capFill)}
.exf{fill:var(--exFill)}
.hlb{fill:var(--hl);fill-opacity:.28;stroke:var(--hl);stroke-width:1.5}
.elb{fill:var(--el);fill-opacity:.35;stroke:var(--el);stroke-width:1.5}
.cell{fill:var(--cell);stroke:var(--muted);stroke-width:1.5}
.nuc{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:6 4}
.ribo{fill:var(--histone);stroke:var(--muted);stroke-width:1}
.hist{fill:var(--histone)}
.ak{stroke:var(--ink);stroke-width:1.8;fill:none;marker-end:url(#aK)}
.cut{stroke:var(--hl);stroke-width:3;stroke-linecap:round}
.mask{fill:var(--svgbg)}
.bx{fill:var(--card);stroke-width:2}
svg [data-s],svg [data-anim]{transition:opacity .7s ease,transform 1.1s ease,stroke-dashoffset 1.6s ease}
svg .off{opacity:0 !important}
.on .drift,.drift.on{animation:drift 3.2s ease forwards}
@keyframes drift{0%,35%{transform:translate(0,0);opacity:1}100%{transform:translate(18px,-28px);opacity:.15}}
.on .pulse,.pulse.on{animation:pulse 1.6s ease-in-out 3}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){svg [data-s],svg [data-anim]{transition:none}.on .drift,.drift.on,.on .pulse,.pulse.on{animation:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <marker id="aK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink)"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--rna)"/></marker>
    <marker id="aB" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--dna1)"/></marker>
  </defs>
</svg>
<header class="top"><div class="in">
  <button class="ib" id="homeBtn" aria-label="Izbornik">☰</button>
  <h1 id="ttl">Biologija 2</h1>
  <button class="ib" id="themeBtn" aria-label="Promijeni temu">🌓</button>
</div></header>
<main class="wrap" id="app"></main>

<script>
"use strict";
/* ================= POHRANA ================= */
var LS_KEY = 'bioVP.v1';
function loadState(){ try{ var s = JSON.parse(localStorage.getItem(LS_KEY)); return (s && typeof s === 'object') ? s : {}; }catch(e){ return {}; } }
var state = Object.assign({ scenes:{}, quiz:{}, rate:1, theme:null }, loadState());
if(!state.scenes || typeof state.scenes !== 'object') state.scenes = {};
if(!state.quiz || typeof state.quiz !== 'object') state.quiz = {};
function saveState(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }

/* ================= SVG POMOĆNICI ================= */
function t(x,y,s,c,a){ return '<text x="'+x+'" y="'+y+'" class="l '+(c||'')+'" text-anchor="'+(a||'middle')+'">'+s+'</text>'; }
function g(s,anim,inner,cls){ if(arguments.length>4||(cls&&cls.indexOf('<')>=0)) console.error('g(): krivi argumenti '+(new Error().stack||'').split('\n')[2]); return '<g'+(s!=null?' data-s="'+s+'"':'')+(anim?' data-anim="'+anim+'"':'')+(cls?' class="'+cls+'"':'')+'>'+inner+'</g>'; }
function svg(){ return '<svg viewBox="0 0 360 240" role="img" aria-label="Animirani dijagram">'+Array.prototype.join.call(arguments,'')+'</svg>'; }
function ticks(x1,x2,step,y1,y2){ var o=''; for(var x=x1;x<=x2;x+=step) o+='<line x1="'+x+'" y1="'+y1+'" x2="'+x+'" y2="'+y2+'" class="gr"/>'; return o; }
function cap(i,s){ return g(i+'-'+i,null,t(180,233,s,'b')); }

/* ================= SADRŽAJ: P16/17 ================= */
var P16 = {
 id:'p16', code:'P16/17', title:'Transkripcija i obrada mRNA',
 scenes:[
 /* ---------- SCENA 1 ---------- */
 { title:'Što je transkripcija? Prokarioti vs. eukarioti',
   legend:['dna1','dna2','rna','enz'],
   svg: svg(
     /* dogma */
     '<rect x="15" y="10" width="70" height="30" rx="8" class="bx" style="stroke:var(--dna1)"/>'+t(50,30,'DNA','b cB')+
     '<rect x="145" y="10" width="70" height="30" rx="8" class="bx" style="stroke:var(--rna)"/>'+t(180,30,'RNA','b cR')+
     '<rect x="275" y="10" width="70" height="30" rx="8" class="bx" style="stroke:var(--enz)"/>'+t(310,30,'protein','b cG')+
     '<line x1="88" y1="25" x2="140" y2="25" class="ak"/><line x1="218" y1="25" x2="270" y2="25" class="ak"/>'+
     '<rect x="76" y="44" width="78" height="14" rx="4" class="hlb" style="stroke:none"/>'+t(115,55,'transkripcija','s b')+t(245,55,'translacija','s')+
     /* step 0 */
     g('0-0',null,
       t(180,95,'jednosmjerni protok genetičke informacije','b')+
       '<rect x="120" y="140" width="120" height="26" rx="4" class="hlb" style="stroke:none"/>'+t(180,134,'gen')+
       '<line x1="40" y1="148" x2="320" y2="148" class="cd"/><line x1="40" y1="158" x2="320" y2="158" class="ct"/>'+
       '<line x1="180" y1="172" x2="180" y2="198" class="ak"/>'+t(190,190,'transkripcija','s','start')+
       '<line x1="120" y1="212" x2="240" y2="212" class="rn"/>'+t(250,216,'RNA (kopija gena)','s cR','start')),
     /* step 1 */
     g('1-1',null,
       t(20,82,'kodirajući lanac 5′→3′','s b cB','start')+
       '<path class="cd" d="M20 100 L120 100 Q180 66 240 100 L340 100"/>'+
       '<path class="ct" d="M20 160 L120 160 Q180 186 240 160 L340 160"/>'+
       ticks(28,112,12,102,158)+ticks(252,336,12,102,158)+
       t(10,104,'5′','s b')+t(350,104,'3′','s b')+t(10,164,'3′','s b')+t(350,164,'5′','s b')+
       '<ellipse class="ez" cx="180" cy="130" rx="62" ry="44"/>'+
       '<path class="rn" d="M150 62 Q150 140 172 146 L216 146" marker-end="url(#aR)"/>'+t(146,58,'5′','s b cR','end')+t(226,140,'3′','s b cR','start')+
       t(300,84,'RNA raste 5′→3′','s b cR')+
       t(20,186,'kalup lanac (čita se 3′→5′)','s b cB2','start')+t(300,200,'RNA polimeraza','s b cG')),
     /* step 2 */
     g('2-2',null,
       '<rect x="12" y="64" width="336" height="170" rx="28" class="cell"/>'+t(180,84,'PROKARIOT: sve u citoplazmi, istodobno','b')+
       '<rect x="60" y="100" width="70" height="19" rx="3" class="hlb" style="stroke:none"/><rect x="140" y="100" width="70" height="19" rx="3" class="elb" style="stroke:none"/><rect x="220" y="100" width="70" height="19" rx="3" class="hlb" style="stroke:none"/>'+
       t(95,97,'gen A','s')+t(175,97,'gen B','s')+t(255,97,'gen C','s')+
       '<line x1="40" y1="106" x2="320" y2="106" class="cd" style="stroke-width:3"/><line x1="40" y1="113" x2="320" y2="113" class="ct" style="stroke-width:3"/>'+
       '<path class="rn" d="M62 118 Q62 150 92 152 L300 152" marker-end="url(#aR)"/>'+
       '<ellipse class="ribo" cx="130" cy="150" rx="16" ry="11"/><ellipse class="ribo" cx="190" cy="150" rx="16" ry="11"/><ellipse class="ribo" cx="250" cy="150" rx="16" ry="11"/>'+
       t(180,182,'policistronska mRNA (A + B + C)','s b cR')+t(180,200,'ribosomi prevode dok se mRNA još prepisuje','s')+t(180,218,'gotovo nikakva dorada','s m')),
     /* step 3 */
     g('3-3',null,
       '<rect x="12" y="64" width="336" height="170" rx="28" class="cell"/>'+
       '<ellipse class="nuc" cx="110" cy="150" rx="88" ry="68"/>'+t(110,102,'JEZGRA','b')+t(110,116,'transkripcija + dorada','s')+
       '<line x1="40" y1="130" x2="180" y2="130" class="cd" style="stroke-width:3"/><line x1="40" y1="136" x2="180" y2="136" class="ct" style="stroke-width:3"/>'+
       '<path class="rn" d="M60 156 L160 156" style="stroke-width:3"/>'+t(110,172,'pre-mRNA','s cR')+
       '<line x1="110" y1="176" x2="110" y2="190" class="ak"/>'+
       '<circle cx="74" cy="200" r="5" class="cpf"/><path class="rn" d="M80 200 L140 200" style="stroke-width:3"/>'+t(146,204,'AAA','s cK b','start')+
       '<line x1="170" y1="196" x2="238" y2="170" class="ak"/>'+
       t(290,96,'CITOPLAZMA','b')+t(290,110,'translacija','s')+
       '<path class="rn" d="M245 160 L335 160" style="stroke-width:3"/><ellipse class="ribo" cx="288" cy="158" rx="16" ry="11"/>'+
       t(285,198,'monocistronska:','s b')+t(285,213,'1 gen → 1 mRNA → 1 protein','s'))
   ),
   steps:[
     {html:'<p>☕ Sjedni, imam trač iz stanice! Genetička informacija putuje <b>samo u jednom smjeru</b>: <b>DNA → RNA → protein</b>. To je <b>središnja (centralna) dogma molekularne biologije</b>.</p><p>Prvi korak (DNA → RNA) je <b>transkripcija</b> 📝, a drugi (RNA → protein) <b>translacija</b>. Dakle, transkripcija je <b>prvi korak u ekspresiji gena</b>.</p><span class="mn">🧠 Mnemonik: trans-<b>KRIP</b>-cija = <b>prepisivanje</b> (iz DNA u RNA), trans-<b>LACIJA</b> = <b>prevođenje</b> (iz RNA u protein).</span>'},
     {html:'<p>🔍 <b>Transkripcija je sinteza RNA</b>: nastaje <b>jednolančana RNA</b> komplementarna <b>jednom</b> lancu dvostruke DNA uzvojnice.</p><p>Taj lanac je <b>kalup lanac</b> (nekodirajući) i čita se <b>3′→5′</b>. Drugi je <b>kodirajući lanac</b> (5′→3′): ima <b>isti slijed kao nastala RNA</b>, samo što DNA ima <b>T</b> tamo gdje RNA ima <b>U</b>.</p><p>RNA se sintetizira <b>5′→3′</b> – nukleotidi se dodaju na <b>3′ kraj</b> rastućeg lanca. 🧵</p><span class="mn">🧠 Kodirajući lanac je „blizanac” RNA 👯, a kalup lanac je „kalup za kolače” – obrnut i komplementaran.</span>'},
     {html:'<p>🦠 <b>Prokarioti</b>: <b>transkripcija i translacija</b> odvijaju se <b>u istom odjeljku (citoplazmi) i istodobno</b>! Ribosomi se hvataju za mRNA dok se ona još prepisuje.</p><p>Dorade <b>gotovo nema</b> – mRNA se prevodi <b>odmah, još tijekom transkripcije</b>. mRNA je često <b>policistronska</b>: prepisana s <b>više susjednih gena</b>, kodira <b>više proteina</b>. 📦 Paket-aranžman!</p>'},
     {html:'<p>🏛️ <b>Eukarioti</b> su birokrati: <b>transkripcija u jezgri</b>, <b>translacija u citoplazmi</b> – <b>prostorno i vremenski odvojene</b>.</p><p>Prvo nastaje <b>primarni transkript (pre-mRNA)</b> koji se <b>dorađuje</b>: <b>kapa</b>, <b>poli-A rep</b> i <b>izrezivanje introna</b>. mRNA je <b>monocistronska</b>: 1 gen → 1 mRNA → 1 protein.</p><span class="mn">🧠 <b>POLI</b>cistronska = <b>PRO</b>karioti (puno gena u paketu) · <b>MONO</b>cistronska = eukarioti (svaki gen svoja mRNA).</span>'}
   ],
   q:{ type:'mc', text:'Gdje se u <b>eukariotskoj</b> stanici odvijaju transkripcija i translacija?',
     opts:[
       {t:'Obje istodobno u citoplazmi', why:'To je opis <b>prokariota</b> – kod njih su transkripcija i translacija u istom odjeljku i istodobno.'},
       {t:'Transkripcija u jezgri, translacija u citoplazmi', ok:true, why:'Točno! Kod eukariota su prostorno i vremenski odvojene, a između njih se u jezgri dorađuje pre-mRNA.'},
       {t:'Obje u jezgri', why:'U jezgri se odvija transkripcija (i dorada pre-mRNA), ali <b>translacija je u citoplazmi</b>.'},
       {t:'Transkripcija u citoplazmi, translacija u jezgri', why:'Obrnuto! DNA je u jezgri pa se tamo i prepisuje; prevodi se u citoplazmi.'}
     ]}
 },
 /* ---------- SCENA 2 ---------- */
 { title:'Transkripcija u prokariota (σ, −10/−35, ukosnica)',
   legend:['dna1','dna2','rna','enz','tf','hl'],
   svg: svg(

var hasTTS = ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);
var voice = null, voiceNote = '';
function pickVoice(){
  if(!hasTTS) { voiceNote='Ovaj preglednik ne podržava čitanje naglas; „Slušaj” će samo automatski listati korake.'; return; }
  var vs = speechSynthesis.getVoices() || [];
  var pref = ['hr','bs','sr'];
  voice = null;
  for(var p=0;p<pref.length && !voice;p++){ for(var i=0;i<vs.length;i++){ if((vs[i].lang||'').toLowerCase().replace('_','-').indexOf(pref[p])===0){ voice=vs[i]; break; } } }
  if(vs.length && (!voice || (voice.lang||'').toLowerCase().indexOf('hr')!==0)){
    voiceNote = 'Hrvatski glas nije pronađen na uređaju'+(voice?' (koristi se '+voice.lang+')':'')+'. Android: Postavke → Pretvaranje teksta u govor → Google → instaliraj glasovne podatke za hrvatski.';
  } else voiceNote = '';
  var n=document.getElementById('voiceNote'); if(n) n.textContent = voiceNote;
}
if(hasTTS){ pickVoice(); try{ speechSynthesis.addEventListener('voiceschanged', pickVoice); }catch(e){ speechSynthesis.onvoiceschanged = pickVoice; } }
else pickVoice();

function toSpeech(html){
  var d=document.createElement('div'); d.innerHTML=html;
  d.querySelectorAll('p,span,br,li').forEach(function(e){ e.insertAdjacentText('afterend',' . '); });
  var s=d.textContent; SAY_RULES.forEach(function(r){ s=s.replace(r[0],r[1]); });
  return s.replace(/(\s*\.\s*){2,}/g,'. ').replace(/:\s*\./g,':').trim();
}
function chunks(text){
  var parts = text.replace(/([.!?…:])\s+/g,'$1\n').split('\n'), out=[];
  parts.forEach(function(p){ p=p.trim(); if(!p||/^[.\s]+$/.test(p)) return;
    while(p.length>200){ var i=p.lastIndexOf(', ',200); if(i<60) i=200; out.push(p.slice(0,i+1)); p=p.slice(i+1).trim(); }
    if(p) out.push(p); });
  return out;
}
var tts = { playing:false, token:0, list:[], idx:0, onDone:null, timer:null };
function ttsLoad(text,onDone){ tts.list=chunks(text); tts.idx=0; tts.onDone=onDone; }
function ttsStart(){
  tts.playing=true; var tok=++tts.token;
  if(hasTTS){ try{ speechSynthesis.cancel(); }catch(e){} }
  setTimeout(function(){ ttsNext(tok); }, 60);
  updatePlayBtn();
}
function ttsNext(tok){
  if(tok!==tts.token || !tts.playing) return;
  if(tts.idx>=tts.list.length){ var cb=tts.onDone; if(cb) cb(); return; }
  var txt=tts.list[tts.idx];
  if(!hasTTS){ tts.timer=setTimeout(function(){ if(tok!==tts.token) return; tts.idx++; ttsNext(tok); }, Math.max(1500, txt.split(' ').length*380/state.rate)); return; }
  var u=new SpeechSynthesisUtterance(txt); u.lang='hr-HR'; if(voice) u.voice=voice; u.rate=state.rate;
  u.onend=function(){ if(tok!==tts.token) return; tts.idx++; ttsNext(tok); };
  u.onerror=function(e){ if(tok!==tts.token) return; if(e && (e.error==='interrupted'||e.error==='canceled')) return; tts.idx++; setTimeout(function(){ ttsNext(tok); },200); };
  try{ speechSynthesis.speak(u); }catch(e){ tts.idx++; setTimeout(function(){ ttsNext(tok); },500); }
}
function ttsPause(){ tts.playing=false; tts.token++; clearTimeout(tts.timer); if(hasTTS){ try{ speechSynthesis.cancel(); }catch(e){} } updatePlayBtn(); }
function stopTTS(){ ttsPause(); tts.list=[]; tts.idx=0; }
function updatePlayBtn(){ var b=document.getElementById('playBtn'); if(b) b.textContent = tts.playing ? '⏸ Pauza' : '▶ Slušaj'; }

  window.scrollTo(0,0);
}

/* ================= SCENA ================= */
var cur=null;
function chipsHTML(L,i){
  var h='<nav class="chips" aria-label="Scene">';
  for(var k=0;k<L.scenes.length;k++){
    var cls='chip'+(k===i?' cur':'')+(isDone(L,k)?' done':'')+(isUnlocked(L,k)?'':' lock');
    h+='<a class="'+cls+'" href="#/'+L.id+'/s'+(k+1)+'" aria-label="Scena '+(k+1)+'">'+(k+1)+'</a>';
  }
  h+='<a class="chip'+(i==='kraj'?' cur':'')+(allDone(L)?'':' lock')+'" href="#/'+L.id+'/kraj">Σ Kviz</a></nav>';
  return h;
}
function legendHTML(keys){ return '<div class="legend">'+keys.map(function(k){return '<span><b style="background:'+LEG[k][0]+'"></b>'+LEG[k][1]+'</span>';}).join('')+'</div>'; }

function renderScene(L,i){
  var S=L.scenes[i], n=S.steps.length;
  setTitle(L.code+' · scena '+(i+1)+'/'+L.scenes.length);
  var rates=[0.75,1,1.25,1.5];
  app.innerHTML = chipsHTML(L,i)+
    '<h2>'+(i+1)+'. '+esc(S.title)+'</h2>'+
    '<div class="stage" id="stage">'+S.svg+'</div>'+legendHTML(S.legend)+
    '<div class="dots" id="dots">'+S.steps.map(function(){return '<i></i>';}).join('')+'</div>'+
    '<div class="card"><div class="muted" id="stepLbl" style="font-size:14px"></div><div class="txt" id="txt" aria-live="polite"></div>'+
    '<div class="ctrl"><button class="btn sec" id="prevBtn">◀ Natrag</button><button class="btn sec" id="playBtn">▶ Slušaj</button><button class="btn sec" id="rateBtn" aria-label="Brzina govora">'+state.rate+'×</button><button class="btn" id="nextBtn">Dalje ▶</button></div>'+
    '<div class="note" id="voiceNote">'+esc(voiceNote)+'</div></div>'+
    '<section class="card q hidden" id="qbox"></section>'+
    '<button class="btn" id="nextScene" style="width:100%;margin-top:4px" disabled>'+(i<L.scenes.length-1?'Sljedeća scena →':'Sažetak i kviz →')+'</button>';
  cur={L:L,i:i,step:0,n:n,svg:document.querySelector('#stage svg'),qShown:false};
  document.getElementById('prevBtn').onclick=function(){ goStep(cur.step-1); };
  document.getElementById('nextBtn').onclick=function(){ if(cur.step<n-1) goStep(cur.step+1); else { showQuestion(); document.getElementById('qbox').scrollIntoView({behavior:'smooth',block:'start'}); } };
  document.getElementById('playBtn').onclick=function(){
    if(tts.playing) ttsPause();
    else { if(!tts.list.length || tts.idx>=tts.list.length) loadStepSpeech(); ttsStart(); }
  };
  document.getElementById('rateBtn').onclick=function(){
    var k=(rates.indexOf(state.rate)+1)%rates.length; state.rate=rates[k]; saveState(); this.textContent=state.rate+'×';
    if(tts.playing){ ttsPause(); ttsStart(); }
  };
  document.getElementById('nextScene').onclick=function(){ stopTTS(); location.hash = i<L.scenes.length-1 ? '#/'+L.id+'/s'+(i+2) : '#/'+L.id+'/kraj'; };
  applyStep(cur.svg,-1);
  void cur.svg.getBoundingClientRect();
  if(isDone(L,i)) showQuestion();
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ goStep(0,true); }); });
  window.scrollTo(0,0);
}
function applyStep(svgEl,k){
  svgEl.querySelectorAll('[data-s]').forEach(function(el){
    var v=el.getAttribute('data-s'), a, b;
    if(v.indexOf('-')>0){ var p=v.split('-'); a=+p[0]; b=+p[1]; } else { a=+v; b=99; }
    var on = k>=a && k<=b; el.classList.toggle('off',!on); el.classList.toggle('on',on);
  });
  svgEl.querySelectorAll('[data-anim]').forEach(function(el){
    var props={}, all={};
    el.getAttribute('data-anim').split(';').forEach(function(e){
      var c=e.indexOf(':'); if(c<0) return; var kk=+e.slice(0,c);
      e.slice(c+1).split('|').forEach(function(pv){ var j=pv.indexOf('='); var p=pv.slice(0,j).trim(), val=pv.slice(j+1).trim(); all[p]=1; if(kk<=k) props[p]=val; });
    });
    Object.keys(all).forEach(function(p){ el.style.setProperty(p, props[p]!==undefined?props[p]:''); });
  });
}
function loadStepSpeech(){
  var S=cur.L.scenes[cur.i], txt=toSpeech(S.steps[cur.step].html);
  if(cur.step===0) txt='Scena '+(cur.i+1)+'. '+toSpeech(S.title)+'. '+txt;
  ttsLoad(txt, onStepSpoken);
}
function onStepSpoken(){
  if(!cur) return;
  if(cur.step<cur.n-1){ var tok=tts.token; setTimeout(function(){ if(tok===tts.token && tts.playing) goStep(cur.step+1); },700); }
  else {
    showQuestion();
    var qb=document.getElementById('qbox'); if(qb) qb.scrollIntoView({behavior:'smooth',block:'start'});
    var q=cur.L.scenes[cur.i].q;
    ttsLoad('Pitanje. '+toSpeech(q.text)+(q.opts?' Ponuđeni odgovori: '+q.opts.map(function(o,j){return String.fromCharCode(65+j)+': '+toSpeech(o.t);}).join('. '):''), function(){ ttsPause(); tts.list=[]; });
    var tok=++tts.token; ttsNext(tok);
  }
}
function goStep(k,first){
  if(!cur) return; k=Math.max(0,Math.min(cur.n-1,k));
  cur.step=k; applyStep(cur.svg,k);
  var S=cur.L.scenes[cur.i], txt=document.getElementById('txt');
  txt.classList.add('fade');
  setTimeout(function(){ txt.innerHTML=S.steps[k].html; txt.classList.remove('fade'); }, first?0:180);
  document.getElementById('stepLbl').textContent='Korak '+(k+1)+' / '+cur.n;
  document.querySelectorAll('#dots i').forEach(function(d,j){ d.classList.toggle('on',j<=k); });
  document.getElementById('prevBtn').disabled = k===0;
  document.getElementById('nextBtn').textContent = k<cur.n-1 ? 'Dalje ▶' : 'Pitanje ▼';
  if(k===cur.n-1) showQuestion();
  if(!first || tts.playing){ var was=tts.playing; ttsPause(); loadStepSpeech(); if(was) ttsStart(); }
  else loadStepSpeech();
}

/* ================= PITANJA ================= */
function record(L,i,correct){
  var k=key(L,i), s=state.scenes[k]||{};
  if(s.first===undefined) s.first=correct;
  if(correct){ s.done=true; s.at=Date.now(); }
  state.scenes[k]=s; saveState();
}
function sceneSolved(){
  var b=document.getElementById('nextScene'); if(b) b.disabled=false;
  var c=document.querySelectorAll('.chips .chip');
  if(c[cur.i]) c[cur.i].classList.add('done');
  if(c[cur.i+1]) c[cur.i+1].classList.remove('lock');
  if(allDone(cur.L) && c[c.length-1]) c[c.length-1].classList.remove('lock');
}
function showQuestion(){
  if(!cur || cur.qShown) return; cur.qShown=true;
  var L=cur.L, i=cur.i, q=L.scenes[i].q, box=document.getElementById('qbox'), solved=isDone(L,i);
  box.classList.remove('hidden');
  var h='<h3>❓ Pitanje</h3><p>'+q.text+'</p>';
  if(q.type==='mc'){
    q.opts.forEach(function(o,j){ h+='<button class="opt" data-j="'+j+'">'+String.fromCharCode(65+j)+') '+o.t+'</button>'; });
    h+='<div id="fb"></div>';
    box.innerHTML=h;
    var btns=box.querySelectorAll('.opt');
    var reveal=function(j){
      btns.forEach(function(b,m){ if(q.opts[m].ok){ b.classList.add('ok'); } b.disabled=true; });
    };
    if(solved){ reveal(); document.getElementById('fb').innerHTML='<div class="fb ok">✅ Već riješeno. '+q.opts.filter(function(o){return o.ok;})[0].why+'</div>'; sceneSolved(); }
    btns.forEach(function(b){ b.onclick=function(){
      var j=+b.dataset.j, o=q.opts[j], fb=document.getElementById('fb');
      if(o.ok){ reveal(j); fb.innerHTML='<div class="fb ok">✅ '+o.why+'</div>'; record(L,i,true); sceneSolved(); }
      else { b.classList.add('bad'); b.disabled=true; fb.innerHTML='<div class="fb bad">❌ Nije točno. '+o.why+' Pokušaj ponovno!</div>'; record(L,i,false); }
    }; });
  } else {
    h+='<input id="sa" autocomplete="off" autocapitalize="off" placeholder="Upiši odgovor…" aria-label="Odgovor"><div class="row"><button class="btn" id="saBtn">Provjeri</button><button class="btn sec hidden" id="saShow">Prikaži odgovor</button></div><div id="fb"></div>';
    box.innerHTML=h;
    var inp=document.getElementById('sa'), fb=document.getElementById('fb'), tries=0;
    var win=function(msg){ inp.disabled=true; document.getElementById('saBtn').disabled=true; fb.innerHTML='<div class="fb ok">'+msg+'</div>'; sceneSolved(); };
    if(solved){ inp.value=q.answer; win('✅ Već riješeno. '+q.why); }
    var check=function(){
      var v=norm(inp.value); if(!v) return;
      if(q.accept.indexOf(v)>=0){ record(L,i,true); win('✅ Točno: <b>'+q.answer+'</b>. '+q.why); return; }
      tries++; record(L,i,false);
      var msg=null; for(var m=0;m<q.wrongMap.length;m++){ if(v.indexOf(q.wrongMap[m][0])>=0){ msg=q.wrongMap[m][1]; break; } }
      fb.innerHTML='<div class="fb bad">❌ Nije točno. '+(msg||'')+' '+q.hint+'</div>';
      if(tries>=2) document.getElementById('saShow').classList.remove('hidden');
    };
    document.getElementById('saBtn').onclick=check;
    inp.onkeydown=function(e){ if(e.key==='Enter') check(); };
    document.getElementById('saShow').onclick=function(){ record(L,i,true); inp.value=q.answer; this.classList.add('hidden'); win('Točan odgovor: <b>'+q.answer+'</b>. '+q.why); };
  }
}

/* ================= SAŽETAK + KVIZ ================= */
function renderEnd(L){
  if(!allDone(L)){ location.hash='#/'+L.id+'/s'+(firstOpen(L)+1); return; }
  setTitle(L.code+' · sažetak i kviz');
  var h=chipsHTML(L,'kraj')+'<h2>Σ Sažetak: '+esc(L.title)+'</h2><div class="card"><ul class="sum">'+L.summary.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ul>'+
    '<button class="btn sec" id="sumPlay" style="width:100%">▶ Poslušaj sažetak</button></div><h2>🎯 Mini kviz (5 pitanja)</h2><p class="muted">Svako pitanje ima jedan pokušaj.</p>';
  L.quiz.forEach(function(q,qi){
    h+='<section class="card q" data-qi="'+qi+'"><p><b>'+(qi+1)+'.</b> '+q.text+'</p>'+q.opts.map(function(o,j){return '<button class="opt" data-j="'+j+'">'+String.fromCharCode(65+j)+') '+o.t+'</button>';}).join('')+'<div class="fbq"></div></section>';
  });
  h+='<div class="card hidden" id="res"></div><div class="row"><button class="btn sec" id="again">↻ Ponovi kviz</button><a class="btn" style="display:grid;place-items:center;text-decoration:none" href="#/">Izbornik</a></div>';
  app.innerHTML=h; window.scrollTo(0,0);
  var answers={};
  document.getElementById('sumPlay').onclick=function(){
    if(tts.playing){ ttsPause(); this.textContent='▶ Poslušaj sažetak'; return; }
    var self=this; ttsLoad('Sažetak. '+L.summary.map(toSpeech).join('. '), function(){ ttsPause(); self.textContent='▶ Poslušaj sažetak'; });
    ttsStart(); this.textContent='⏸ Pauza';
  };
  app.querySelectorAll('section.q').forEach(function(sec){
    var qi=+sec.dataset.qi, q=L.quiz[qi], btns=sec.querySelectorAll('.opt');
    btns.forEach(function(b){ b.onclick=function(){
      var j=+b.dataset.j, o=q.opts[j]; answers[qi]=!!o.ok;
      btns.forEach(function(x,m){ x.disabled=true; if(q.opts[m].ok) x.classList.add('ok'); });
      if(!o.ok) b.classList.add('bad');
      var right=q.opts.filter(function(x){return x.ok;})[0];
      sec.querySelector('.fbq').innerHTML = o.ok ? '<div class="fb ok">✅ '+o.why+'</div>' : '<div class="fb bad">❌ '+o.why+'<br>✔️ Točno je: <b>'+right.t+'</b> – '+right.why+'</div>';
      if(Object.keys(answers).length===L.quiz.length){
        var sc=0; Object.keys(answers).forEach(function(k){ if(answers[k]) sc++; });
        var prev=state.quiz[L.id]||{best:0}; state.quiz[L.id]={best:Math.max(prev.best||0,sc),last:sc,at:Date.now()}; saveState();
        var r=document.getElementById('res'); r.classList.remove('hidden');
        r.innerHTML='<div class="score">Rezultat: '+sc+' / '+L.quiz.length+'</div><p>'+(sc===5?'🏆 Savršeno! Spreman/na za kolokvij iz ovog dijela.':sc>=3?'👍 Dobro! Pogledaj objašnjenja pogrešnih pa ponovi.':'💪 Vrati se na scene s pogreškama i ponovi kviz.')+'</p><p class="muted">Najbolji rezultat: '+state.quiz[L.id].best+'/5</p>';
        r.scrollIntoView({behavior:'smooth',block:'center'});
      }
    }; });
  });
  document.getElementById('again').onclick=function(){ renderEnd(L); };
}

/* ================= RUTER ================= */
function route(){
  stopTTS(); cur=null;
  var h=location.hash.replace(/^#\/?/,''), parts=h.split('/'), L=null;
  for(var k=0;k<LECTURES.length;k++) if(LECTURES[k].id===parts[0] && LECTURES[k].scenes) L=LECTURES[k];
  if(!L) return renderMenu();
  if(parts[1]==='kraj') return renderEnd(L);
  var i=parseInt((parts[1]||'s1').slice(1),10)-1;
  if(isNaN(i)||i<0||i>=L.scenes.length) i=0;
  if(!isUnlocked(L,i)){ i=firstOpen(L); history.replaceState(null,'','#/'+L.id+'/s'+(i+1)); }
  renderScene(L,i);
}
window.addEventListener('hashchange',route);
window.addEventListener('pagehide',function(){ stopTTS(); });
route();
</script>
