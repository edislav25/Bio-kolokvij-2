<script type="application/json" id="src-p21">"P21 – rekombinacija i popravak DNA\n1. Zašto je popravak DNA važan\n• DNA je jedina biološka molekula koja se može popraviti\n• Održavanje genomske ravnoteže ključno je za točan prijenos genetičkog\nmaterijala tijekom staničnih dioba\n• Ravnoteža između oštećenja DNA i popravka DNA: neravnoteža dovodi do razvoja\nbolesti (tumori, starenje, nasljedni sindromi).\n• U različitim mehanizmima popravka DNA sudjeluje više od 100 gena.\n2. Pregled: što oštećuje DNA i kako se popravlja\nUzrok oštećenja Mehanizam popravka\nkemijske promjene DNA (depurinacija,\npopravak izrezivanjem baza\ndeaminacija)\nUV zračenje (pirimidinski dimeri) popravak izrezivanjem nukleotida\ngreške nastale tijekom replikacije\npopravak izrezivanjem nukleotida\n(pogrešno sparene baze)\nkemijske promjene DNA (alkilirajući\nizravni popravak\nčimbenici); UV dimeri (ne u čovjeka)\nnepopravljene DNA lezije koje\ntranslezijska sinteza DNA\nzaustavljaju replikaciju\nioniziraujuće zračenje i drugi\npopravak dvolančanih lomova (homologna\ngenotoksični čimbenici (dvolančani\nrekombinacija ili nehomologno spajanje krajeva)\nlomovi)\n3. Popravak izrezivanjem (ekscizijski popravak)\nNajvažniji mehanizam popravka DNA. Sve vrste imaju isti princip u tri koraka:\n1. prepoznavanje oštećene DNA,\n2. uklanjanje (izrezivanje) oštećenog dijela,\n3. popunjavanje nastale pukotine – neoštećeni komplementarni lanac služi kao\nkalup (zatim se lanac spaja ligazom).\nPostoji više tipova, ovisno o veličini pogreške koja se izrezuje:\nTip Uzrok Izrezuje se\nkemijske promjene\nA. izrezivanje baza jedna oštećena baza\nDNA\noligonukleotid s oštećenim\nB. izrezivanje nukleotida UV zračenje\nbazama\nC. popravak pogrešno sparenih pogrešno ugrađena baza u novom\ngreške u replikaciji\nbaza lancu\n3.1. Popravak izrezivanjem baza (BER)\nPopravlja spontane kemijske promjene: depurinacije i deaminacije.\n• Depurinacija – uklanjanje purinske baze (G ili A); prema slajdu rezultira delecijama.\n• Deaminacija – uklanjanje amino skupine (s C, G ili A); rezultira supstitucijama.\n3.2. Popravak izrezivanjem nukleotida (NER)\nPopravlja promjene izazvane UV zračenjem → pirimidinski dimeri: izlaganje UV svjetlu\ndovodi do dimerizacije susjednih pirimidina (T ili C); najpoznatiji je timinski dimer (T–T\nkovalentno povezani). Dimeri iskrivljuju dvostruku uzvojnicu i zaustavljaju replikaciju i\ntranskripciju (prema slajdu rezultiraju delecijama).\nMehanizam:\n1. prepoznavanje oštećenja i kidanje nukleazom s obje strane lezije,\n2. izrezivanje oligonukleotida s oštećenim bazama,\n3. popunjavanje pukotine (polimeraza) i povezivanje (ligaza).\nU čovjeka: popravak posreduje 7 različitih XP proteina (XPA–XPG).\nXeroderma pigmentosum (XP)\n• mutacije u genima za XP proteine → pogreške u popravku timinskih dimera,\n• rijedak genetički poremećaj (incidencija 1 : 250 000),\n• preosjetljivost na UV svjetlost, pjegice, preuranjeno starenje kože,\n• povećan rizik od karcinoma kože i oka.\n3.3. Popravak pogrešno sparenih baza (mismatch repair, MMR)\nPrepoznaje pogrešno sparene baze ugrađene tijekom replikacije koje nisu uklonjene\nkorektivnom (proofreading) aktivnošću DNA polimeraze. To je zapravo provjera\nnovoreplicirane DNA.\nMehanizam:\n1. prepoznavanje oštećenja (pogrešno sparenih baza),\n2. prepoznavanje novosintetiziranog lanca (da se izrezuje nova, a ne ispravna stara\nbaza – u kalup lancu je ispravan slijed),\n3. izrezivanje dijela novog lanca s pogreškom,\n4. popunjavanje pukotine i povezivanje.\nNasljedni nepolipozni kolorektalni karcinom\n• mutacije gena MSH i MLH\n• jedna od najuobičajenijih nasljednih bolesti (incidencija oko 1 : 200 osoba),\n• uzrokuje do 15 % svih karcinoma debelog crijeva.\n4. Izravni popravak (izravni obrat oštećenja DNA)\nPodrazumijeva izravni obrat kemijske reakcije odgovorne za oštećenje, bez izrezivanja. Na\ntaj se način popravljaju:\n• pirimidinski dimeri nastali UV zračenjem – fotoreaktivacija (NE kod ljudi!),\n• alkilirani gvaninski ostaci.\nFotoreaktivacija\n• popravak pirimidinskih dimera nastalih pod utjecajem UV zračenja (enzim fotoliaza\nkoristi svjetlost),\n• tipična za bakterije, kvasce te mnoge biljke i životinje, ne i za čovjeka.\nPopravak alkiliranih gvaninskih ostataka\n• popravak oštećenja nastalih reakcijom DNA s alkilirajućim čimbenicima\n(alkiliranje = adicija metilne ili etilne skupine na različite položaje DNA baza),\n• karakterističan za većinu prokariota i eukariota, uključujući čovjeka; (u pravilu\nga obavlja enzim koji uklanja alkilnu skupinu s gvanina i pritom se sam inaktivira –\nopće znanje).\n5. Translezijska sinteza DNA\nAlternativni mehanizam popravka nepopravljenih DNA lezija. Odvija se u replikacijskim\nrašljama. Specifične DNA polimeraze vrše replikaciju preko oštećenih mjesta, ali uz\nveliku vjerojatnost pogreške\nMehanizam:\n1. normalna DNA polimeraza zaustavlja se na mjestu oštećenja,\n2. specijalizirana DNA polimeraza nastavlja sintezu preko oštećenja,\n3. replikacija se nastavlja normalnom polimerazom,\n4. lezija se naknadno uklanja izrezivanjem (popravak izrezivanjem).\nTime se stanica spašava od zaustavljanja replikacije (i smrti), ali po cijenu mogućih\nmutacija.\n6. Popravak dvolančanih lomova\nDvolančani lom = prekid kontinuiteta DNA u oba lanca. Nastaje pod utjecajem\ngenotoksičnih čimbenika, npr. ionizirajućeg zračenja\nPopravak = zamjena oštećene DNA rekombinacijom s neoštećenom molekulom. Dva\nmehanizma:\nB. Nehomologno spajanje krajeva\nA. Homologna rekombinacija\n(NHEJ)\nkao kalup se koristi homologna\nkrajevi se izravno spajaju bez\nPrincip neoštećena DNA (npr. sestrinska\nhomolognog kalupa\nkromatida)\nsklon pogreškama (gubitak nekoliko\nTočnost točan (informacija se kopira)\nnukleotida na mjestu loma; opće znanje)\n7. DNA rekombinacija\nDNA rekombinacija je proces izmjene ili premještanja segmenata DNA između dva\nkromosoma ili unutar istog kromosoma. Može biti homologna ili nehomologna\n(preslagivanje DNA).\n7.1. Homologna rekombinacija\n• zbiva se između dijelova DNA s homolognim slijedom nukleotida (homologija\nslijeda > 100 pb),\n• uključena je u popravak dvolančanih lomova i rekombinaciju tijekom mejoze\n(crossing over),\n• ne mijenja se ustroj gena na kromosomu (samo se izmjenjuju alelne varijante na\nistim mjestima).\nMehanizam:\n1. zarezani DNA lanac zalazi u drugi (homologni) DNA lanac (invazija lanca),\n2. nastaje međuprodukt s ukiženim lancima – Hollidayeva veza,\n3. cijepanje i ponovno spajanje ukiženih lanaca (razrješenje Hollidayeve veze),\n4. nastaje rekombinantna molekula.\nHollidayev model je molekularni model DNA rekombinacije koji uključuje stvaranje\nheterodupleksa (područje dvostruke uzvojnice u kojem je jedan lanac od jedne, a drugi od\ndruge roditeljske molekule). Ne može objasniti početak rekombinacije (zahtijeva\nistodobno zarezivanje obje roditeljske molekule na istim područjima).\nHollidayeva veza: spoj ukiženih lanaca nastalih homolognim sparivanjem između dviju\nDNA molekula; međuprodukt rekombinacije. Njezinim razrješenjem nastaje\nrekombinantna molekula.\n7.2. Nehomologna rekombinacija\n• zbiva se između nesrodnih (nehomolognih) molekula DNA,\n• dovodi do preslagivanja gena (promjena redoslijeda nukleotida),\n• uključena je u promjene u ekspresiji i funkciji gena tijekom razvoja i\ndiferencijacije i u održavanje genetičke raznolikosti.\nTipovi preslagivanja DNA:\n• Mjesno specifična rekombinacija – između specifičnih DNA slijedova manje\nhomologije; omogućuje raznolikost imunoglobulina i T-stanica (protutijela i\nreceptori T-stanica nastaju preslagivanjem gena).\n• Transpozicija – premještanje DNA slijedova (transpozoni, retrotranspozoni); ne\nzahtijeva homologiju."</script>

     {html:'<p>🧲 Prokarioti imaju <b>jednu RNA polimerazu za sve vrste RNA</b>. U <i>E. coli</i> ona ima <b>šest podjedinica</b>: <b>pet čini srž (core)</b> s katalitičkom aktivnošću, a šesta je <b>σ (sigma)</b> – <b>slabo vezana</b>, ali <b>nužna za prepoznavanje promotora</b>.</p><p>σ se veže na sljedove <b>−10 i −35</b> (broj parova baza uzvodno od +1). Polimeraza sjedi na DNA, ali je DNA još zatvorena: to je <b>zatvoreni kompleks promotora</b> 🔒.</p><span class="mn">🧠 σ = <b>S</b>igurna navigacija 🧭 – bez nje srž ne zna gdje stati.</span>'},
     {html:'<p>🔓 Vezanjem σ na −10 i −35 DNA se <b>odmotava oko mjesta inicijacije</b> → nastaje <b>otvoreni kompleks promotora</b>. Sad <b>započinje sinteza RNA</b> od mjesta +1.</p><p>Bitno: RNA polimeraza, za razliku od DNA polimeraze, <b>ne treba početnicu</b> 💪. Dodaje <b>ribonukleozid-5′-trifosfate (rNTP)</b> prema pravilu komplementarnosti baza.</p>'},
     {html:'<p>👋 σ podjedinica je <b>slabo vezana i može se odvojiti</b> od srži. Time završava <b>inicijacija</b> – prva od tri faze: <b>inicijacija, elongacija, terminacija</b>.</p><span class="add">➕ <b>Dodatno objašnjenje</b> (nije u skripti): nakon što sinteza RNA krene, σ se obično odvoji, a srž nastavlja sama.</span>'},
     {html:'<p>🚂 <b>Elongacija</b>: RNA polimeraza se pomiče duž DNA i <b>produljuje lanac RNA</b> (5′→3′). Ispred sebe <b>odmotava</b> DNA, a iza sebe je <b>ponovno zamata</b>.</p><p>Zato odmotano područje – <b>transkripcijski mjehur</b> 🫧 – ostaje veličine <b>oko 15 bp</b>. Kao patentni zatvarač koji je otvoren samo oko klizača!</p>'},

     {html:'<p>🪜 <b>Razine regulacije</b>: 1. <b>epigenetska</b>, 2. <b>transkripcijska</b>, 3. <b>post-transkripcijska</b>, 4. <b>translacijska</b>, 5. <b>post-translacijska</b>. Geni su regulirani <b>prvenstveno na razini transkripcije</b>, ali kontrola je moguća u <b>bilo kojem koraku</b>.</p><p>Regulaciju transkripcije određuju: <b>regulatorni elementi</b> (vrsta, broj, položaj, kombinacija), <b>dostupnost i aktivnost TF</b> (središnja uloga) i <b>preuređenje kromatina</b>.</p><span class="mn">🧠 E-T-P-T-P: „<b>E</b>to <b>T</b>i <b>P</b>et <b>T</b>račeva <b>P</b>opodne” ☕</span>'},

     {html:'<p>🤫 <b>MikroRNA (miRNA)</b> – <b>post-transkripcijski nadzor</b>. <b>Nekodirajuće</b> RNA duljine <b>21–24 nt</b> koje nadziru ekspresiju velikog broja gena. Geni za miRNA su na <b>svim kromosomima osim Y</b>, u intergenskim područjima i intronima, često u skupinama.</p><p>Mehanizam: miRNA je <b>djelomično komplementarna</b> ciljnoj mRNA → <b>RNA-RNA hibrid</b> (dvolančana RNA) → <b>represija translacije i/ili razgradnja mRNA</b>.</p>'},
     {html:'<p>🌿 <b>Epigenetika</b> = znanost o <b>nasljednom i reverzibilnom</b> nadzoru aktivnosti gena koji <b>ne uključuje promjenu slijeda nukleotida</b> u DNA. Modifikacije su <b>djelomično nasljedne</b> (stabilne kroz <b>mitozu</b>, dijelom i kroz <b>mejozu</b>), <b>reverzibilne</b> (okoliš: prehrana, agensi, starenje…) i djeluju kao <b>prekidači</b> 🔛.</p><p><b>Genomski upis (imprinting)</b>: ekspresija gena ovisi o <b>roditeljskom podrijetlu</b> (utišan je alel jednog roditelja). Primjeri s predavanja: <b>parcijalna mola hidatidoza</b> i <b>uniparentna disomija</b>.</p>'},
     {html:'<p>🧷 <b>Mehanizmi epigenetskih modifikacija</b>: 1. <b>DNA metilacija</b>, 2. <b>modifikacije histona</b>, 3. <b>nekodirajuće RNA</b> → sve vode do <b>remodelacije kromatina</b> (više ili manje dostupan transkripciji).</p><p><b>DNA metilacija</b>: kovalentno vezanje <b>CH₃</b>; u sisavaca samo na <b>citozine u CpG dinukleotidima</b> (u velikom utoru DNA) → <b>5-metilcitozin</b>. Metilacija CpG-a u <b>promotoru</b> povezana je s <b>utišavanjem gena</b> 🔇.</p><span class="mn">🧠 „Metil na promotoru = gen na <i>mute</i>.” 🤐</span>'}

/* ================= DODATNI SVG POMOĆNICI ================= */
function bx(x,y,w,h,st,rx){ return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(rx==null?6:rx)+'" style="'+st+'"/>'; }
function chip(x,y,w,h,label,st,tc){ return bx(x,y,w,h,st)+t(x+w/2,y+h/2+4,label,tc||'s b'); }
function arr(x1,y1,x2,y2){ return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" class="ak"/>'; }
var ST={
  soft:'fill:var(--tf);fill-opacity:.15;stroke:var(--tf)',
  hl:'fill:var(--hl);fill-opacity:.22;stroke:var(--hl)',
  ok:'fill:var(--enz);fill-opacity:.2;stroke:var(--enz)',
  rna:'fill:var(--rna);fill-opacity:.2;stroke:var(--rna)',
  dna:'fill:var(--dna1);fill-opacity:.18;stroke:var(--dna1)',
  el:'fill:var(--el);fill-opacity:.25;stroke:var(--el)',
  mir:'fill:var(--mir);fill-opacity:.2;stroke:var(--mir)',
  sn:'fill:var(--sn);fill-opacity:.2;stroke:var(--sn)',
  gray:'fill:var(--histone);fill-opacity:.35;stroke:var(--muted)',
  ribo:'fill:var(--histone);fill-opacity:.55;stroke:var(--muted);stroke-width:1.5',
  tf:'fill:var(--tfFill)', snF:'fill:var(--snFill)', exF:'fill:var(--exFill)', capF:'fill:var(--capFill)'
};
/* tRNA sličica: centar x, vrh y; aa = tekst aminokiseline ili '' */
function trna(x,y,anti,aa,col){
  col=col||'var(--sn)';
  return '<path d="M'+(x-4)+' '+(y+14)+' L'+(x-4)+' '+(y+40)+' M'+(x+4)+' '+(y+14)+' L'+(x+4)+' '+(y+40)+'" style="stroke:'+col+';stroke-width:3"/>'+
    '<rect x="'+(x-18)+'" y="'+(y+40)+'" width="36" height="18" rx="5" style="fill:'+col+';fill-opacity:.25;stroke:'+col+';stroke-width:2"/>'+
    t(x,y+53,anti,'s b')+(aa?'<circle cx="'+x+'" cy="'+(y+6)+'" r="10" style="fill:var(--el)"/>'+t(x,y+10,aa,'s b'):'');
}

     {html:'<p>🔤 mRNA se „čita” prema <b>genetičkom kodu</b>. Dva pojma koja se lako pobrkaju:</p><p>• <b>KOD</b> = <b>tri baze u DNA</b>.<br>• <b>KODON</b> = <b>tri baze u mRNA</b> – komplementaran i antiparalelan kodu u DNA. Svaki kodon opisuje određenu aminokiselinu.</p><span class="mn">🧠 Kod<b>ON</b> je <b>ON</b> na mRNA (na „izlazu” iz jezgre), kod ostaje kod kuće u DNA. 🏠</span>'},
     {html:'<p>🧮 <b>Zašto triplet?</b> Treba dovoljno kombinacija za <b>20 aminokiselina</b>: 1 nukleotid → 4, 2 nukleotida → 16 (premalo!), <b>3 nukleotida → 64</b> – prvi broj koji je dovoljan. Zato je kodon <b>triplet</b>.</p>'},
     {html:'<p>🚦 Od <b>64 kodona, 61 kodira aminokiseline</b>.</p><p>• <b>START kodon: AUG</b> – kodira <b>metionin (Met)</b>, prvi prevedeni kodon.<br>• <b>STOP kodoni: UAA, UAG, UGA</b> – signaliziraju kraj translacije i <b>ne kodiraju</b> aminokiseline.</p><span class="mn">🧠 STOP: „<b>U</b> <b>A</b>ute <b>A</b>! · <b>U</b> <b>A</b>uto <b>G</b>ori! · <b>U</b> <b>G</b>aži <b>A</b>!” 🚗</span>'},
     {html:'<p>📋 <b>Obilježja koda</b>:</p><p>• <b>Redundancija (degeneriranost)</b> – jedna Ak može biti kodirana s <b>više kodona</b>.<br>• <b>Nedvosmislenost</b> – isti kodon <b>ne kodira dvije</b> različite Ak.<br>• <b>Gotovo univerzalnost</b> – isti kod koristi gotovo sva živa bića → jedan od najjačih dokaza <b>zajedničkog evolucijskog nasljeđa</b>. 🌍</p><span class="mn">🧠 Redundancija = „više ključeva za ista vrata”, nedvosmislenost = „jedan ključ otvara samo jedna vrata”. 🔑</span>'}

     {html:'<p>🔌 <b>tRNA</b> je „adapter” između jezika nukleotida i jezika aminokiselina. Duga je <b>70–80 nukleotida</b>, ima strukturu <b>lista djeteline</b> (u prostoru oblik slova <b>L</b>).</p><p>Dvije ključne regije:<br>• <b>antikodon</b> – veže se na <b>komplementarni kodon u mRNA</b>,<br>• <b>CCA na 3′ kraju</b> – tu se veže <b>aminokiselina</b>.</p><p>Stanice imaju oko <b>40 različitih tRNA</b> za <b>20 aminokiselina</b>.</p><span class="mn">🧠 tRNA = taksi 🚕: na krovu (3′ CCA) nosi putnika-aminokiselinu, a „registarska tablica” (antikodon) mora odgovarati adresi (kodonu).</span>'},
     {html:'<p>⚡ Aminokiselinu na pravu tRNA stavlja enzim <b>aminoacil-tRNA sintetaza</b>, uz <b>ATP</b>:</p><p>1. Ak se spaja na <b>AMP</b> → <b>aminoacil-AMP</b> intermedijer,<br>2. Ak se prenosi na <b>OH skupinu riboze na 3′ kraju tRNA (3′ CCA)</b> → <b>aminoacil-tRNA („nabijena” tRNA)</b>.</p><p>Za <b>svaku aminokiselinu postoji posebna sintetaza</b> – visoko selektivni enzimi. Točnost ugradnje ovisi o <b>dva koraka</b>: pravoj Ak na pravoj tRNA (sintetaza) i <b>kodon–antikodon sparivanju</b>.</p>'},
     {html:'<p>🤝 Na ribosomu <b>antikodon tRNA</b> prepoznaje i sparuje se s <b>kodonom mRNA</b> (komplementarno i antiparalelno). Dakle: <b>aminoacil-tRNA ulazi u sintezu tako što prepozna kodon</b>.</p><p>Usput: <b>peptidil-tRNA</b> je tRNA na koju je vezan <b>rastući polipeptid</b>.</p>'},
     {html:'<p>🎢 <b>Wobble (kolebanje)</b>: neke tRNA prepoznaju <b>više od jednog kodona</b> jer je sparivanje na <b>trećem položaju kodona</b> manje strogo od standardnog A–U i G–C.</p><p>• npr. <b>G se može sparivati s U</b> (G–U par),<br>• <b>inozin (I)</b> (nastaje deaminacijom adenozina; do 10 % baza u tRNA) sparuje se s <b>U, C i A</b>.</p><span class="mn">🧠 Wobble = „klimavi treći zub” 🦷 – prva dva drže čvrsto, treći se klima.</span>'}

  else { o+='<rect x="'+(x-3.5)+'" y="'+(y-h/2)+'" width="7" height="'+h+'" rx="3.5" style="fill:'+col+'"/><circle cx="'+x+'" cy="'+y+'" r="3" style="fill:var(--ink)"/>'; }
  return o+(lab?t(x,y+h/2+14,lab,'s'):'');
}

var hasTTS = ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);

function pickVoice(){
  if(!hasTTS) { voiceNote='Ovaj preglednik ne podržava čitanje naglas; „Slušaj” će samo automatski listati korake.'; return; }
  var vs = speechSynthesis.getVoices() || [];
  var pref = ['hr','bs','sr'];
  voice = null;
  for(var p=0;p<pref.length && !voice;p++){ for(var i=0;i<vs.length;i++){ if((vs[i].lang||'').toLowerCase().replace('_','-').indexOf(pref[p])===0){ voice=vs[i]; break; } } }
  if(vs.length && (!voice || (voice.lang||'').toLowerCase().indexOf('hr')!==0)){
    voiceNote = 'Hrvatski glas nije pronađen na uređaju'+(voice?' (koristi se '+voice.lang+')':'')+'. Android: Postavke → Pretvaranje teksta u govor → Google → instaliraj glasovne podatke za hrvatski.';
  } else voiceNote = '';
  var n=document.getElementById('voiceNote'); if(n) n.textContent = voiceNote;
}
if(hasTTS){ pickVoice(); try{ speechSynthesis.addEventListener('voiceschanged', pickVoice); }catch(e){ speechSynthesis.onvoiceschanged = pickVoice; } }

function toSpeech(html){
  var d=document.createElement('div'); d.innerHTML=html;
  d.querySelectorAll('p,span,br,li').forEach(function(e){ e.insertAdjacentText('afterend',' . '); });
  var s=d.textContent; SAY_RULES.forEach(function(r){ s=s.replace(r[0],r[1]); });
  return s.replace(/(\s*\.\s*){2,}/g,'. ').replace(/:\s*\./g,':').trim();
}
function chunks(text){
  var parts = text.replace(/([.!?…:])\s+/g,'$1\n').split('\n'), out=[];
  parts.forEach(function(p){ p=p.trim(); if(!p||/^[.\s]+$/.test(p)) return;
    while(p.length>200){ var i=p.lastIndexOf(', ',200); if(i<60) i=200; out.push(p.slice(0,i+1)); p=p.slice(i+1).trim(); }
    if(p) out.push(p); });
  return out;
}
var tts = { playing:false, token:0, list:[], idx:0, onDone:null, timer:null };
function ttsLoad(text,onDone){ tts.list=chunks(text); tts.idx=0; tts.onDone=onDone; }
function ttsStart(){
  tts.playing=true; var tok=++tts.token;
  if(hasTTS){ try{ speechSynthesis.cancel(); }catch(e){} }
  setTimeout(function(){ ttsNext(tok); }, 60);
  updatePlayBtn();
}
function ttsNext(tok){
  if(tok!==tts.token || !tts.playing) return;
  if(tts.idx>=tts.list.length){ var cb=tts.onDone; if(cb) cb(); return; }
  var txt=tts.list[tts.idx];
  if(!hasTTS){ tts.timer=setTimeout(function(){ if(tok!==tts.token) return; tts.idx++; ttsNext(tok); }, Math.max(1500, txt.split(' ').length*380/state.rate)); return; }
  var u=new SpeechSynthesisUtterance(txt); u.lang='hr-HR'; if(voice) u.voice=voice; u.rate=state.rate;
  u.onend=function(){ if(tok!==tts.token) return; tts.idx++; ttsNext(tok); };
  u.onerror=function(e){ if(tok!==tts.token) return; if(e && (e.error==='interrupted'||e.error==='canceled')) return; tts.idx++; setTimeout(function(){ ttsNext(tok); },200); };
  try{ speechSynthesis.speak(u); }catch(e){ tts.idx++; setTimeout(function(){ ttsNext(tok); },500); }
}
function ttsPause(){ tts.playing=false; tts.token++; clearTimeout(tts.timer); if(hasTTS){ try{ speechSynthesis.cancel(); }catch(e){} } updatePlayBtn(); }
function stopTTS(){ ttsPause(); tts.list=[]; tts.idx=0; }
function updatePlayBtn(){ var b=document.getElementById('playBtn'); if(b) b.textContent = tts.playing ? '⏸ Pauza' : '▶ Slušaj'; }

var cur=null;
function chipsHTML(L,i){
  var h='<nav class="chips" aria-label="Scene">';
  for(var k=0;k<L.scenes.length;k++){
    var cls='chip'+(k===i?' cur':'')+(isDone(L,k)?' done':'')+(isUnlocked(L,k)?'':' lock');
    h+='<a class="'+cls+'" href="#'+L.id+'-s'+(k+1)+'" aria-label="Scena '+(k+1)+'">'+(k+1)+'</a>';
  }
  h+='<a class="chip'+(i==='kraj'?' cur':'')+(allDone(L)?' done':'')+'" href="#'+L.id+'-kraj">Σ Kviz</a></nav>';
  return h;
}
function legendHTML(keys){ return '<div class="legend">'+keys.map(function(k){return '<span><b style="background:'+LEG[k][0]+'"></b>'+LEG[k][1]+'</span>';}).join('')+'</div>'; }

function renderScene(L,i){
  var S=L.scenes[i], n=S.steps.length;
  setTitle(L.code+' · scena '+(i+1)+'/'+L.scenes.length);
  var rates=[0.75,1,1.25,1.5];

    '<div class="stage" id="stage">'+S.svg+'</div>'+legendHTML(S.legend)+

    '<div class="ctrl"><button class="btn sec" id="prevBtn">◀ Natrag</button><button class="btn sec" id="playBtn">▶ Slušaj</button><button class="btn sec" id="rateBtn" aria-label="Brzina govora">'+state.rate+'×</button><button class="btn" id="nextBtn">Dalje ▶</button></div>'+
    '<div class="note" id="voiceNote">'+esc(voiceNote)+'</div></div>'+askPanelHTML()+
    '<section class="card q hidden" id="qbox"></section>'+
    '<button class="btn" id="nextScene" style="width:100%;margin-top:4px">'+(i<L.scenes.length-1?'Sljedeća scena →':'Sažetak i kviz →')+'</button>';
  cur={L:L,i:i,step:0,n:n,svg:document.querySelector('#stage svg'),qShown:false};
  wireAsk();
  document.getElementById('prevBtn').onclick=function(){ goStep(cur.step-1); };
  document.getElementById('nextBtn').onclick=function(){ if(cur.step<n-1) goStep(cur.step+1); else { showQuestion(); document.getElementById('qbox').scrollIntoView({behavior:'smooth',block:'start'}); } };
  document.getElementById('playBtn').onclick=function(){
    if(tts.playing) ttsPause();
    else { if(!tts.list.length || tts.idx>=tts.list.length) loadStepSpeech(); ttsStart(); }
  };
  document.getElementById('rateBtn').onclick=function(){
    var k=(rates.indexOf(state.rate)+1)%rates.length; state.rate=rates[k]; saveState(); this.textContent=state.rate+'×';
    if(tts.playing){ ttsPause(); ttsStart(); }
  };
  document.getElementById('nextScene').onclick=function(){ stopTTS(); location.hash = i<L.scenes.length-1 ? '#'+L.id+'-s'+(i+2) : '#'+L.id+'-kraj'; };
  applyStep(cur.svg,-1);
  void cur.svg.getBoundingClientRect();
  if(isDone(L,i)) showQuestion();
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ goStep(0,true); }); });
  window.scrollTo(0,0);
}
function applyStep(svgEl,k){
  svgEl.querySelectorAll('[data-s]').forEach(function(el){
    var v=el.getAttribute('data-s'), a, b;
    if(v.indexOf('-')>0){ var p=v.split('-'); a=+p[0]; b=+p[1]; } else { a=+v; b=99; }
    var on = k>=a && k<=b; el.classList.toggle('off',!on); el.classList.toggle('on',on);
  });
  svgEl.querySelectorAll('[data-anim]').forEach(function(el){
    var props={}, all={};
    el.getAttribute('data-anim').split(';').forEach(function(e){
      var c=e.indexOf(':'); if(c<0) return; var kk=+e.slice(0,c);
      e.slice(c+1).split('|').forEach(function(pv){ var j=pv.indexOf('='); var p=pv.slice(0,j).trim(), val=pv.slice(j+1).trim(); all[p]=1; if(kk<=k) props[p]=val; });
    });
    Object.keys(all).forEach(function(p){ el.style.setProperty(p, props[p]!==undefined?props[p]:''); });
  });
}
function loadStepSpeech(){
  var S=cur.L.scenes[cur.i], txt=toSpeech(S.steps[cur.step].html);
  if(cur.step===0) txt='Scena '+(cur.i+1)+'. '+toSpeech(S.title)+'. '+txt;
  ttsLoad(txt, onStepSpoken);
}
function onStepSpoken(){
  if(!cur) return;
  if(cur.step<cur.n-1){ var tok=tts.token; setTimeout(function(){ if(tok===tts.token && tts.playing) goStep(cur.step+1); },700); }
  else {
    showQuestion();
    var qb=document.getElementById('qbox'); if(qb) qb.scrollIntoView({behavior:'smooth',block:'start'});
    var q=cur.L.scenes[cur.i].q;
    ttsLoad('Pitanje. '+toSpeech(q.text)+(q.opts?' Ponuđeni odgovori: '+q.opts.map(function(o,j){return String.fromCharCode(65+j)+': '+toSpeech(o.t);}).join('. '):''), function(){ ttsPause(); tts.list=[]; });
    var tok=++tts.token; ttsNext(tok);
  }
}
function goStep(k,first){
  if(!cur) return; k=Math.max(0,Math.min(cur.n-1,k));
  cur.step=k; applyStep(cur.svg,k);
  var S=cur.L.scenes[cur.i], txt=document.getElementById('txt');
  txt.classList.add('fade');
  setTimeout(function(){ txt.innerHTML=S.steps[k].html; txt.classList.remove('fade'); }, first?0:180);
  document.getElementById('stepLbl').textContent='Korak '+(k+1)+' / '+cur.n;
  document.querySelectorAll('#dots i').forEach(function(d,j){ d.classList.toggle('on',j<=k); });
  document.getElementById('prevBtn').disabled = k===0;
  document.getElementById('nextBtn').textContent = k<cur.n-1 ? 'Dalje ▶' : 'Pitanje ▼';
  if(k===cur.n-1) showQuestion();
  resetAsk();
  if(!first || tts.playing){ var was=tts.playing; ttsPause(); loadStepSpeech(); if(was) ttsStart(); }
  else loadStepSpeech();
}

/* ================= PITANJA ================= */
function record(L,i,correct){
  var k=key(L,i), s=state.scenes[k]||{};
  if(s.first===undefined) s.first=correct;
  if(correct){ s.done=true; s.at=Date.now(); }
  state.scenes[k]=s; saveState();
}
function sceneSolved(){
  var b=document.getElementById('nextScene'); if(b) b.disabled=false;
  var c=document.querySelectorAll('.chips .chip');
  if(c[cur.i]) c[cur.i].classList.add('done');
  if(c[cur.i+1]) c[cur.i+1].classList.remove('lock');
  if(allDone(cur.L) && c[c.length-1]) c[c.length-1].classList.remove('lock');
}
function showQuestion(){
  if(!cur || cur.qShown) return; cur.qShown=true;
  var L=cur.L, i=cur.i, q=L.scenes[i].q, box=document.getElementById('qbox'), solved=isDone(L,i);
  box.classList.remove('hidden');
  var h='<h3>❓ Pitanje</h3><p>'+q.text+'</p>';
  if(q.type==='mc'){
    q.opts.forEach(function(o,j){ h+='<button class="opt" data-j="'+j+'">'+String.fromCharCode(65+j)+') '+o.t+'</button>'; });
    h+='<div id="fb"></div>';
    box.innerHTML=h;
    var btns=box.querySelectorAll('.opt');
    var reveal=function(j){
      btns.forEach(function(b,m){ if(q.opts[m].ok){ b.classList.add('ok'); } b.disabled=true; });
    };
    if(solved){ reveal(); document.getElementById('fb').innerHTML='<div class="fb ok">✅ Već riješeno. '+q.opts.filter(function(o){return o.ok;})[0].why+'</div>'; sceneSolved(); }
    btns.forEach(function(b){ b.onclick=function(){
      var j=+b.dataset.j, o=q.opts[j], fb=document.getElementById('fb');
      if(o.ok){ reveal(j); fb.innerHTML='<div class="fb ok">✅ '+o.why+'</div>'; record(L,i,true); sceneSolved(); }
      else { b.classList.add('bad'); b.disabled=true; fb.innerHTML='<div class="fb bad">❌ Nije točno. '+o.why+' Pokušaj ponovno!</div>'; record(L,i,false); }
    }; });
  } else {
    h+='<input id="sa" autocomplete="off" autocapitalize="off" placeholder="Upiši odgovor…" aria-label="Odgovor"><div class="row"><button class="btn" id="saBtn">Provjeri</button><button class="btn sec hidden" id="saShow">Prikaži odgovor</button></div><div id="fb"></div>';
    box.innerHTML=h;
    var inp=document.getElementById('sa'), fb=document.getElementById('fb'), tries=0;
    var win=function(msg){ inp.disabled=true; document.getElementById('saBtn').disabled=true; fb.innerHTML='<div class="fb ok">'+msg+'</div>'; sceneSolved(); };
    if(solved){ inp.value=q.answer; win('✅ Već riješeno. '+q.why); }
    var check=function(){
      var v=norm(inp.value); if(!v) return;
      if(q.accept.indexOf(v)>=0){ record(L,i,true); win('✅ Točno: <b>'+q.answer+'</b>. '+q.why); return; }
      tries++; record(L,i,false);
      var msg=null; for(var m=0;m<q.wrongMap.length;m++){ if(v.indexOf(q.wrongMap[m][0])>=0){ msg=q.wrongMap[m][1]; break; } }
      fb.innerHTML='<div class="fb bad">❌ Nije točno. '+(msg||'')+' '+q.hint+'</div>';
      if(tries>=2) document.getElementById('saShow').classList.remove('hidden');
    };
    document.getElementById('saBtn').onclick=check;
    inp.onkeydown=function(e){ if(e.key==='Enter') check(); };
    document.getElementById('saShow').onclick=function(){ record(L,i,true); inp.value=q.answer; this.classList.add('hidden'); win('Točan odgovor: <b>'+q.answer+'</b>. '+q.why); };
  }
}

    h+='<section class="card q" data-qi="'+qi+'"><p><b>'+(qi+1)+'.</b> '+q.text+'</p>'+q.opts.map(function(o,j){return '<button class="opt" data-j="'+j+'">'+String.fromCharCode(65+j)+') '+o.t+'</button>';}).join('')+'<div class="fbq"></div></section>';
  });
  h+='<div class="card hidden" id="res"></div><div class="row"><button class="btn sec" id="again">↻ Ponovi kviz</button><a class="btn" style="display:grid;place-items:center;text-decoration:none" href="#izbornik">Izbornik</a></div>';

  document.getElementById('sumPlay').onclick=function(){
    if(tts.playing){ ttsPause(); this.textContent='▶ Poslušaj sažetak'; return; }
    var self=this; ttsLoad('Sažetak. '+L.summary.map(toSpeech).join('. '), function(){ ttsPause(); self.textContent='▶ Poslušaj sažetak'; });
    ttsStart(); this.textContent='⏸ Pauza';
  };
  app.querySelectorAll('section.q').forEach(function(sec){
    var qi=+sec.dataset.qi, q=L.quiz[qi], btns=sec.querySelectorAll('.opt');
    btns.forEach(function(b){ b.onclick=function(){
      var j=+b.dataset.j, o=q.opts[j]; answers[qi]=!!o.ok;
      btns.forEach(function(x,m){ x.disabled=true; if(q.opts[m].ok) x.classList.add('ok'); });
      if(!o.ok) b.classList.add('bad');
      var right=q.opts.filter(function(x){return x.ok;})[0];
      sec.querySelector('.fbq').innerHTML = o.ok ? '<div class="fb ok">✅ '+o.why+'</div>' : '<div class="fb bad">❌ '+o.why+'<br>✔️ Točno je: <b>'+right.t+'</b> – '+right.why+'</div>';
      if(Object.keys(answers).length===L.quiz.length){
        var sc=0; Object.keys(answers).forEach(function(k){ if(answers[k]) sc++; });
        var prev=state.quiz[L.id]||{best:0}; state.quiz[L.id]={best:Math.max(prev.best||0,sc),last:sc,at:Date.now()}; saveState();
        var r=document.getElementById('res'); r.classList.remove('hidden');
        r.innerHTML='<div class="score">Rezultat: '+sc+' / '+L.quiz.length+'</div><p>'+(sc===L.quiz.length?'🏆 Savršeno! Spreman/na za kolokvij iz ovog dijela.':sc>=Math.ceil(L.quiz.length*0.6)?'👍 Dobro! Pogledaj objašnjenja pogrešnih pa ponovi.':'💪 Vrati se na scene s pogreškama i ponovi kviz.')+'</p><p class="muted">Najbolji rezultat: '+state.quiz[L.id].best+'/5</p>';
        r.scrollIntoView({behavior:'smooth',block:'center'});
      }
    }; });
  });

}


/* ================= SPREMANJE NA RAČUN (db) ================= */
var cloud={ref:null,on:false,busy:false,again:false,timer:null};
function saveNoteText(){ return cloud.on ? '☁️ Napredak se sprema na tvoj claude.ai račun (vidi se na svim uređajima).' : '📱 Napredak se sprema u ovom pregledniku.'; }
function mergeIn(d){
  if(!d||typeof d!=='object') return;
  var sc=d.scenes||{}; Object.keys(sc).forEach(function(k){ var a=state.scenes[k]||{}, b=sc[k]||{};
    state.scenes[k]={done:!!(a.done||b.done), first:(a.first!==undefined?a.first:b.first), at:Math.max(a.at||0,b.at||0)||undefined}; });
  var qz=d.quiz||{}; Object.keys(qz).forEach(function(k){ var a=state.quiz[k]||{}, b=qz[k]||{};
    var newer=(b.at||0)>(a.at||0)?b:a; state.quiz[k]={best:Math.max(a.best||0,b.best||0), last:newer.last||0, at:newer.at||0}; });
  if(typeof d.rate==='number') state.rate=d.rate;
}
function pushCloud(){ if(!cloud.on) return; clearTimeout(cloud.timer); cloud.timer=setTimeout(flushCloud,700); }
function flushCloud(){
  if(!cloud.on) return; if(cloud.busy){ cloud.again=true; return; }
  cloud.busy=true;
  var body=JSON.parse(JSON.stringify({scenes:state.scenes,quiz:state.quiz,rate:state.rate,updatedAt:Date.now()}));
  cloud.ref.set(body).then(function(){ cloud.busy=false; if(cloud.again){ cloud.again=false; flushCloud(); } })
    .catch(function(e){ cloud.busy=false; if(e&&(e.code==='invalid_argument'||e.code==='not_granted')){ cloud.on=false; var n=document.getElementById('saveNote'); if(n) n.textContent=saveNoteText(); } });
}
function initCloud(){
  if(!window.claude || typeof window.claude.use!=='function') return;
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    var db=r[0], user=r[1]; if(!db||!user) return null;
    return user.id().then(function(uid){
      if(!uid) return null;
      cloud.ref=db.doc('napredak/'+uid);
      var to=new Promise(function(_,rej){ setTimeout(function(){ rej({code:'timeout'}); },10000); });
      return Promise.race([cloud.ref.get(),to]);
    });
  }).then(function(snap){
    if(!snap) return;
    if(snap.exists) mergeIn(snap.data());
    try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
    cloud.on=true; pushCloud();
    if(!cur && !/kraj/.test(location.hash)) renderMenu();
    else { var n=document.querySelectorAll('.chips .chip'); if(cur) cur.L.scenes.forEach(function(_,k){ if(n[k]) n[k].classList.toggle('done',isDone(cur.L,k)); }); }
  }).catch(function(){});
}

function wireAsk(){

    function reveal(sel){

      q.opts.forEach(function(o,j){ if(o.ok && sel.indexOf(j)<0) expl.push('✔️ Točno je bilo: <b>'+o.t+'</b> – '+o.why); });
      fb.innerHTML='<div class="fb '+(good?'ok':'bad')+'">'+expl.join('<br>')+'</div>'+(q.note?'<div class="add">ℹ️ '+q.note+'</div>':'');
      var c=sec.querySelector('[data-check]'); if(c) c.classList.add('hidden');
      done(n,good);
    }
    if(!q.two){ btns.forEach(function(b){ b.onclick=function(){ reveal([+b.dataset.j]); }; }); return; }
    var sel=[], chk=sec.querySelector('[data-check]');

      var j=+b.dataset.j, i=sel.indexOf(j);

    }; });
    chk.onclick=function(){ btns.forEach(function(b){ b.style.outline=''; }); reveal(sel.slice()); };
  });

/* ================= RUTER ================= */
function route(){
  stopTTS(); abortAsk(); cur=null;
  var h=location.hash.replace(/^#\/?/,''), parts=h.split(/[-\/]/), L=null;
  if(h==='ispit') return renderExam(false,'ispit');
  if(h==='stari') return renderExam(false,'stari');
  for(var k=0;k<LECTURES.length;k++) if(LECTURES[k].id===parts[0] && LECTURES[k].scenes) L=LECTURES[k];
  if(!L) return renderMenu();
  if(parts[1]==='kraj') return renderEnd(L);
  var i=parseInt((parts[1]||'s1').slice(1),10)-1;
  if(isNaN(i)||i<0||i>=L.scenes.length) i=0;
  if(!isUnlocked(L,i)){ i=firstOpen(L); try{ history.replaceState(null,'','#'+L.id+'-s'+(i+1)); }catch(e){} }
  renderScene(L,i);
}
window.addEventListener('hashchange',route);
window.addEventListener('pagehide',function(){ stopTTS(); });
route();
initCloud();
initAsk();
