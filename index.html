<script type="application/json" id="src-p13">"P13 - programirana stanična smrt\n1. Što je apoptoza i zašto je važna\nU višestaničnom organizmu svaka stanica prima signale koji joj govore što da radi: preživi,\nraste i dijeli se, diferencira se ili umre. Stanična smrt je dakle jedan od normalnih\n\"ishoda\" signalnih puteva, jednako kao i dioba ili diferencijacija.\nApoptoza = programirana stanična smrt. To je normalan, fiziološki oblik stanične smrti\nkoji ima ključnu ulogu u embrionalnom razvoju i u održavanju odraslih tkiva.\nZašto se kaže \"programirana\"? Zato što je to aktivan proces: stanica troši energiju (ATP) i\nsintetizira specifične proteine koji izvode vlastito razgrađivanje.\nBiološka važnost apoptoze\nApoptoza je neophodna za:\n• Embrionalni razvoj – npr. uklanjanje interdigitalnog tkiva (kožice između prstiju) pri\nformiranju prstiju. Ako apoptoza zakaže, nastaje sindaktilija (prirođena anomalija –\nsrasli prsti). Isto tako, tijekom razvoja živčanog sustava sisavaca ukloni se do 50 %\nneurona, čime se uspostavljaju pravilne veze među neuronima u mozgu.\n• Metamorfozu – npr. reapsorpcija repa kod punoglavca pri pretvorbi u žabu.\n• Homeostazu tkiva (održavanje stalnog broja stanica) – npr. u čovjeka se dnevno\nukloni oko 5 × 10¹¹ krvnih stanica; također ljuštenje stijenke maternice\n(endometrija) u menstrualnom ciklusu (apoptoza žljezdanog epitela i strome).\n• Obrambenu ulogu – uklanjanje zaraženih i oštećenih stanica:\no stanice zaražene virusom (NK-stanice potiču apoptozu zaraženih stanica),\no stanice s oštećenom DNA,\no tumorske stanice (zračenje i kemoterapija djeluju upravo tako da potiču\napoptozu u tumorskim stanicama),\no suvišne stanice imunosnog sustava (npr. višak limfocita na kraju\nimunoodgovora).\n2. Morfologija apoptoze – što se događa sa stanicom\nRedoslijed zbivanja:\n1. Stanica se odvaja od okoline i skvrči (smanjuje se). Kromatin se segregira i\nkondenzira, a kondenzira se i citoplazma.\n2. Dolazi do fragmentacije jezgre (i DNA) te do izbočenja membrane (\"blebbing\").\n3. Stanica se raspada na komadiće okružene membranom – apoptotička tjelešca.\nIshod: stanica se skvrči i raspadne u apoptotička tjelešca. Budući da su tjelešca omeđena\nmembranom, sadržaj stanice ne izlazi u okolinu pa nema upale.\nKako fagociti prepoznaju apoptotičnu stanicu? – signal \"pojedi me\"\nU normalnoj stanici fosfolipid fosfatidilserin nalazi se samo na unutarnjem listiću\nmembrane (prema citosolu). Tijekom apoptoze enzim scramblaza (aktiviraju je kaspaze)\npremješta fosfatidilserin na vanjsku površinu stanice. Fagociti ga prepoznaju receptorima i\nfagocitiraju stanicu. Zato se fosfatidilserin naziva \"pojedi me\" (\"eat me\") signal.\n3. Apoptoza vs. nekroza\nNekroza je nekontrolirana, patološka smrt stanice (npr. zbog ozljede, ishemije, toksina) –\nstanica nabubri i pukne, sadržaj iscuri u okolinu i izaziva upalu.\nZnačajka Nekroza Apoptoza\nVeličina stanice uvećana (bubrenje) smanjena (skupljanje)\nfragmentirana jezgra, piknoza /\nIzgled jezgre piknoza / karioreksa\nkarioreksa\nStanična intaktna (mijenja se samo položaj\nprekinuta (disrupcija)\nmembrana fosfatidilserina)\nrazgrađuju ga enzimi, otpušta intaktan; može se otpustiti u\nStanični sadržaj\nse izvan stanice apoptotičkim tjelešcima\nUpala često prisutna nije prisutna\nFiziološki/patološki samo patološki proces fiziološki i patološki\nEnergija (ATP) nije potrebna (pasivno) potrebna (aktivan proces)\nPiknoza = zgušnjavanje (kondenzacija) jezgre; karioreksa = raspad jezgre na komadiće.\nApoptoza = \"tihi, uredni\" kraj (stanica se smanji, zapakira u mjehuriće i pojedu je fagociti,\nbez upale). Nekroza = \"eksplozija\" (stanica nabubri, pukne, izaziva upalu).\n4. Regulatori apoptoze\nApoptozu kontroliraju četiri skupine čimbenika:\n1. Kaspaze – izvršitelji apoptoze,\n2. porodica Bcl-2 proteina – središnji regulatori,\n3. IAP proteini – negativni regulatori (inhibitori apoptoze),\n4. signalni putovi – intrinzički (unutarnji) i ekstrinzički (vanjski).\nŠto potiče stanicu na samouništenje?\n• Izostanak pozitivnih signala: faktori rasta neurona, interleukin-2, citokini, faktori\nrasta, spolni hormoni…\n• Primanje negativnih signala: ionizacijsko zračenje, povišena koncentracija\noksidansa u stanici, \"proteini smrti\" – ligandi poput TNF-a i Fas-liganda.\n5. Kaspaze – izvršitelji apoptoze\nKaspaze su proteaze koje na aktivnom mjestu imaju cistein (Cys), a proteinski supstrat\nrežu iza aspartata (Asp). (Iz toga i naziv: cysteine-aspartic protease.)\nMorfološke promjene u apoptozi posljedica su toga što kaspaze kidaju više od 100\nrazličitih staničnih proteina. Primjeri:\n• cijepaju ICAD (inhibitor DNaze) → oslobođena DNaza fragmentira DNA,\n• cijepaju nuklearne lamine → raspad jezgre,\n• cijepaju proteine citoskeleta (aktin, miozin, α-aktinin, tubulin, vimentin) →\nfragmentacija stanice, izbočenje membrane,\n• cijepaju proteine Golgijeva aparata,\n• aktiviraju scramblazu → fosfatidilserin na površinu stanice.\nKako se kaspaze aktiviraju?\nKaspaze se u citoplazmi nalaze kao proenzimi – prokaspaze. Aktiviraju se proteolitičkim\ncijepanjem na dvije podjedinice (veliku i malu) koje čine aktivnu kaspazu. To se događa na\ndva načina:\n• autokatalizom – inicijatorske kaspaze se aktiviraju međusobnim cijepanjem nakon\ndimerizacije (približavanja molekula) na apoptotički signal,\n• posredovanjem drugih kaspaza – tako nastaje kaskada.\nPodjela kaspaza:\n• Inicijatorske: kaspaze 2, 8, 9, 10 – prve se aktiviraju i \"pokreću lanac\".\n• Efektorske (izvršne): kaspaze 3, 6, 7 – razgrađuju stanične proteine i izvršavaju\nsmrt.\n6. Porodica Bcl-2 – središnji regulatori apoptoze\nBcl-2 proteini odlučuju hoće li stanica živjeti ili umrijeti – njihova ravnoteža određuje\nsudbinu stanice. Kontroliraju apoptozu na dva načina: izravno kontroliraju aktivaciju\nkaspaza te čuvaju integritet mitohondrija, odnosno kontroliraju oslobađanje\nmitohondrijskih proteina u citoplazmu.\nDijele se na:\n1. Antiapoptotički proteini – inhibitori apoptoze:\n2. Proapoptotički proteini – induciraju aktivaciju kaspaza i potiču staničnu smrtKako\nto funkcionira (regulacijske interakcije)\n• U normalnoj stanici: samo-BH3 proteini su inaktivni, a višedomenski\nproapoptotički proteini (Bax/Bak) su inhibirani antiapoptotičkim proteinima (Bcl-\n2…). Stanica živi.\n7. IAP proteini – negativni regulatori apoptoze\nIAP kaspaze drže pod kontrolom: vežu kaspaze i inhibiraju njihovu aktivnost ili potiču\nnjihovu razgradnju u proteasomu. Time sprječavaju da se apoptoza slučajno pokrene\n(npr. zbog spontane aktivacije prokaspaza).\nIAP-ovi također imaju svoje inhibitore: Smac/Diablo je mitohondrijski protein (nalazi se u\nmeđumembranskom prostoru) koji se pri apoptozi oslobađa u citoplazmu, veže IAP i tako\noslobađa kaspazu iz kompleksa – indirektno omogućuje njezinu aktivaciju. Dakle: signal\nsmrti → inhibicija IAP-a → aktivne kaspaze → apoptoza.\n8. Signalni putovi apoptoze\nPostoje dva glavna puta – intrinzički (unutarnji, mitohondrijski) i ekstrinzički (vanjski,\nput receptora smrti) – te varijanta intrinzičkog puta preko endoplazmatskog retikuluma\n(ER-stres). Svi se na kraju sastaju u aktivaciji efektorskih kaspaza (osobito kaspaze-3).\n8.1. Intrinzički (mitohondrijski) put\nPokreće ga stanični stres: oštećenje DNA, virusna infekcija, manjak faktora rasta, toksini.\nTijek:\n1. Signal stanične smrti aktivira samo-BH3 proteine, a oni aktiviraju Bax/Bak na\nvanjskoj membrani mitohondrija.\n2. Bax/Bak stvaraju pore pa mitohondrij otpušta citokrom c (i Smac/Diablo) u citosol.\n3. Citokrom c veže Apaf-1 i zajedno s prokaspazom-9 stvara apoptosom.\n4. U apoptosomu se aktivira kaspaza-9 (inicijatorska).\n5. Kaspaza-9 cijepa i aktivira efektorsku kaspazu-3 (i druge izvršne kaspaze).\n6. Kaspaza-3 izvršava razgradnju stanice → apoptoza.\n7. Istodobno Smac/Diablo veže IAP-ove i uklanja \"kočnicu\" s kaspaza.\nApoptosom\nApoptosom je velik proteinski kompleks u obliku \"kotača\" sastavljen od citokroma c +\nApaf-1 + inicijatorske kaspaze-9. Služi kao platforma na kojoj se kaspaza-9 aktivira.\n(Definicija za ispit: apoptosom = kompleks citokroma c, Apaf-1 i kaspaze-9.)\n8.2. Ekstrinzički put (put receptora smrti)\nPokreću ga signali drugih stanica; posreduje ubijanje tumorskih i virusom zaraženih\nstanica te uklanjanje viška limfocita na kraju imunoodgovora.\nTijek:\n1. Ligand smrti (npr. Fas-ligand ili TNF) veže se na receptor smrti (Fas, TNF-receptor)\nna površini stanice. Citoplazmatski dio takvih receptora ima domenu smrti – DD\n(Death Domain).\n2. Na DD se vežu adaptorski proteini i prokaspaza-8; nastaje kompleks DISC (Death-\nInducing Signaling Complex).\n3. Prokaspaza-8 se autokatalitički aktivira (kaspaza-8, inicijatorska).\n4. Aktivirana kaspaza-8:\no izravno aktivira efektorske kaspaze (3, 6, 7), i/ili\no cijepa Bid (proapoptotički regulatorni protein) → aktivni Bid aktivira Bak/Bax\nna mitohondriju → nastavak intrinzičkim putem (citokrom c → apoptosom →\nkaspaza-9 → kaspaza-3).\nMitohondrij – spoj unutarnjeg i vanjskog puta\nTo je ključna točka koju profesor naglašava (!!): vanjski put preko Bid-a \"uključuje\"\nmitohondrij, pa je mitohondrij mjesto na kojem se sastaju oba puta. Uloga mitohondrija u\nprogramiranoj staničnoj smrti, ukratko:\n• mjesto djelovanja Bcl-2 proteina (Bax/Bak stvaraju pore, Bcl-2 ih sprječava),\n• izvor citokroma c (nužan za apoptosom),\n• izvor Smac/Diablo (inhibitor IAP-a),\n• poveznica između ekstrinzičkog i intrinzičkog puta (preko Bid-a).\n8.3. Put ER-stresa (varijanta intrinzičkog puta)\nKad se u endoplazmatskom retikulumu nakupe pogrešno smotani proteini, aktivira se UPR\n(unfolded protein response). Ako stres traje i stanica ga ne može riješiti, aktiviraju se JNK i\nCHOP te (u miša) kaspaza-12, što vodi do aktivacije efektorskih kaspaza i smrti stanice.\nUsporedba puteva\nEkstrinzički Intrinzički (mitohondrijski) ER-stres\nligand smrti (FasL, stanični stres (DNA, toksini, nakupljanje krivo\nOkidač\nTNF) na receptor manjak faktora rasta, virus) smotanih proteina\nKompleks DISC apoptosom –\nInicijatorska kaspaza-12 (miš),\nkaspaza-8 kaspaza-9\nkaspaza JNK, CHOP\nZajednički efektorske kaspaze,\nzavršetak posebno kaspaza-3\n9. Alternativni putovi programirane stanične smrti\nApoptoza nije jedini oblik regulirane smrti stanice. Važni alternativni putovi:\n• Autofagija – stanica razgrađuje vlastite dijelove u lizosomima (stvara se\nautofagosom koji se spoji s lizosomom). Karakteristično je nakupljanje lizosoma u\nstanicama.\n• Nekroptoza – regulirana smrt stanice nekrozom: izvana izgleda kao nekroza\n(pucanje membrane), ali je programirana i regulirana. Oslobađaju se DAMPs\n(damage-associated molecular patterns – molekule iz unutrašnjosti stanice koje su\nsastavni dio urođenog imunološkog odgovora) pa je za razliku od apoptoze\nproupalna (apoptoza = protuupalni odgovor).\n• (U materijalima se spominje i ferroptoza, oblik smrti stanice ovisan o željezu.)\nZašto su alternativni putovi važni:\n• omogućuju staničnu smrt kad apoptoza zakaže (npr. kad tumorske stanice blokiraju\nkaspaze),\n• imaju važnu ulogu u upali, imunološkom nadzoru, infekcijama i tumorima,\n• predstavljaju nove terapijske mete (npr. induciranje ferroptoze u tumorskim\nstanicama otpornima na terapiju).\n10. Abnormalna apoptoza i bolesti\nZdravo tkivo je u ravnoteži između staničnog preživljavanja i smrti. Poremećaj ravnoteže u\nbilo kojem smjeru uzrokuje bolest:\n• Inhibirana (preslaba) apoptoza → stanice koje bi trebale umrijeti prežive: rak (npr.\nprekomjerna ekspresija Bcl-2), kronične upalne bolesti, autoimune bolesti\n(preživljavanje autoreaktivnih limfocita).\n• Prekomjerna apoptoza → gubitak stanica koje bi trebale živjeti:\nneurodegenerativne bolesti – Parkinsonova, Alzheimerova, amiotrofična lateralna\nskleroza (ALS), sindaktilija."</script>
<script type="application/json" id="src-p15">"P15 – replikacija DNA\nStruktura DNA: dva komplementarna lanca su antiparalelna: jedan ide 3′→5′, a drugi 5′→3′.\nTaj podatak je ključan za razumijevanje cijele replikacije, jer enzimi mogu čitati/graditi lanac\nsamo u jednom smjeru.\nKada se događa? Replikacija se odvija u S-fazi interfaze staničnog ciklusa. Prethodi mitozi\ni ulasku u mejozu (1. mejotičku diobu). Time se osigurava da stanica ima udvojeni genom\nprije diobe.\n2. Replikacija je semikonzervativna\nPri replikaciji se dva roditeljska lanca razdvoje i svaki služi kao kalup (predložak) za\nsintezu novog komplementarnog lanca. Svaka nova molekula DNA sastoji se od jednog\nstarog (roditeljskog) i jednog novog lanca – zato se zove semikonzervativna (polovica se\n„čuva”).\n3. Replikacija je precizna\nDNA polimeraza usmjerava ugradnju nukleotida prema pravilu komplementarnosti baza\n(A–T, G–C) na osnovi kalupa. Pogrešno ugrađena baza dogodi se otprilike jednom na 10⁹\ndo 10¹⁰ ugrađenih nukleotida. Tu preciznost omogućuje samokorigirajuća (proofreading)\naktivnost DNA polimeraze.\n4. Osnovni princip: DNA polimeraza\nReakciju katalizira DNA polimeraza, glavni enzim replikacije. Njezina svojstva:\n• dodaje deoksiribonukleozid-5′-trifosfat (dNTP) na 3′-hidroksilnu (3′-OH) skupinu\nrastućeg DNA lanca; između nukleotida nastaje fosfodiesterska veza,\n• sintetizira DNA isključivo u smjeru 5′→3′,\n• ne može započeti novi lanac – može dodavati nove dNTP-ove samo na već\npostojeći kratki lanac (početnica / primer / klica) koji je vodikovim vezama sparen s\nkalupom i ima slobodan 3′-OH kraj.\nPrimaza i RNA početnice\n• DNA primaza je vrsta RNA polimeraze koja radi u smjeru 5′→3′. Kao supstrat koristi\nribonukleozid-5′-trifosfate (rNTP).\n• Sintetizira kratku RNA početnicu (oko 3–10 nukleotida), čime stvara sparen 3′-OH\nkraj potreban DNA polimerazi.\n• Sinteza DNA počinje vezanjem DNA polimeraze na 3′-OH kraj početnice.\n• Na kraju se RNA početnice moraju ukloniti: egzonukleaznom aktivnošću\npolimeraze i RNAzom H (enzim koji razgrađuje RNA lanac u RNA-DNA hibridu).\nRazličite polimeraze imaju različite uloge (eukarioti)\nU stanicama sisavaca početak sinteze (osobito zaostajućeg lanca) vodi kompleks primaze\ni polimeraze α. On stvara kratke hibridne fragmente (RNA + nekoliko DNA nukleotida),\nkoje potom produljuju polimeraze δ i ε.\n5. Proofreading – DNA polimeraza kao samokorigirajući enzim\nAko DNA polimeraza ugradi pogrešnu bazu (npr. C umjesto T), ona posjeduje\negzonukleaznu aktivnost u smjeru 3′→5′ (suprotno od smjera sinteze) kojom hidrolizira\npogrešno ugrađeni nukleotid, a zatim nastavlja sintezu s ispravnom bazom. To je razlog\ntako velike točnosti replikacije.\n6. Izvorišta replikacije i replikacijske rašlje\nReplikacija započinje na posebnim mjestima, izvorištima (ishodištima) replikacije – ori\n(origin). Na svakom izvorištu nastaju dvije replikacijske rašlje (viljuške) koje se pomiču u\nsuprotnim smjerovima (dvosmjerna replikacija). U svakoj rašlji se roditeljski lanci\nrazdvajaju i služe kao kalup za dva nova lanca kćeri.\nZašto eukarioti trebaju mnogo izvorišta? Genom je golem, a replikacija spora pa bi s\njednim izvorištem trajala predugo.\n7. Vodeći i zaostajući (trom) lanac\nBudući da su lanci antiparalelni, a DNA polimeraza gradi samo 5′→3′, dva nova lanca ne\nmogu se sintetizirati na isti način:\n• Vodeći lanac (leading) – sintetizira se kontinuirano, u smjeru kretanja replikacijske\nrašlje. Treba mu samo jedna početnica na početku.\n• Zaostajući ili trom lanac (lagging) – sintetizira se diskontinuirano, iz kratkih\nfragmenata, i to unatrag u odnosu na smjer kretanja rašlje. Ti kratki fragmenti zovu\nse Okazakijevi fragmenti.\nSudbina RNA početnica i Okazakijevih fragmenata\nZa svaki Okazakijev fragment treba nova RNA početnica (stvara je primaza). Redoslijed\ndogađaja:\n1. Primaza sintetizira RNA početnicu na kalupu zaostajućeg lanca.\n2. DNA polimeraza veže se na 3′-OH kraj početnice i sintetizira Okazakijev fragment\ndo sljedeće početnice.\n3. RNAza H (i egzonukleazna aktivnost polimeraze) uklanjaju RNA početnicu, a DNA\npolimeraza popunjava pukotinu DNA nukleotidima.\n4. DNA ligaza spaja susjedne fragmente.\nDNA ligaza\nDNA ligaze kataliziraju stvaranje fosfodiesterske veze između 5′ kraja jednog i 3′ kraja\nsusjednog Okazakijeva fragmenta. Reakcija troši ATP\n8. Proteini replikacijske rašlje (replisom)\nZa kopiranje tako velikih molekula DNA potreban je složen multienzimski kompleks;\nenzimi djeluju koordinirano, uz istodobnu sintezu vodećeg i tromog lanca. Sastoji se od:\n• DNA polimeraze (u paru),\n• DNA primaze,\n• DNA helikaze,\n• SSB proteina (single-strand binding proteins),\n• DNA topoizomeraze (I i II),\n• RNAze H i DNA ligaze.\nPregled enzima i njihove uloge\nHelikaza i SSB\nHelikaza razdvaja roditeljske lance ispred rašlje, a SSB proteini sprječavaju da se\nrazdvojeni jednolančani kalupi ponovno sparuju ili stvore sekundarne strukture.\nTopoizomeraze – rješenje problema torzijalnog stresa\nProblem: dok helikaza razmata dvostruku zavojnicu, ispred rašlje se nakuplja torzijalni\nstres (DNA se zavija sve više), a DNA se ne može slobodno brzo rotirati. Nekontrolirana\nrotacija blokirala bi replikaciju.\nKlizajuća stezaljka i pomoćni proteini polimeraze\nDNA polimeraza sama bi se brzo odvajala od kalupa. Zato postoje pomoćni proteini:\n• Klizajuća stezaljka (u sisavaca PCNA) – protein oblika prstena oko DNA kalupa\nkoji održava povezanost polimeraze s kalupom.\n• Proteini za stavljanje stezaljke (u sisavaca RFC) – uz ATP otvaraju prsten,\npostavljaju ga na DNA na spoju početnice i kalupa, a zatim se otpuštaju (hidroliza\nATP-a zatvara stezaljku). DNA polimeraza se potom veže na stezaljku.\nDvije polimeraze u rašlji (dimer polimeraze)\nU rašlji djeluju dva kompleksa DNA polimeraze (dimer polimeraze): polimeraza δ na\nvodećem lancu, a polimeraza α na zaostajućem lancu (završava sintezu Okazakijeva\nfragmenta). Kalup zaostajućeg lanca savije se u petlju (zavoj) tako da polimeraza\nzaostajućeg lanca ide u istom smjeru kao i cijela rašlja, iako gradi lanac „unatrag”. Obje\npolimeraze povezane su s klizajućom stezaljkom vezanom na helikazu u rašlji.\n9. Sažetak događaja u rašlji\nHelikaza, primaza i dvije molekule DNA polimeraze koordinirano sintetiziraju vodeći i\nzaostajući lanac. Kalup zaostajućeg lanca je uvijen tako da polimeraza zaostajućeg lanca\nide u smjeru kretanja rašlje. Topoizomeraza djeluje kao os okretanja ispred rašlje, a DNA\npolimeraza i ligaza uklanjaju RNA početnice i spajaju Okazakijeve fragmente iza rašlje.\n10. Bolesti povezane s replikacijom\nBloomov sindrom (mutacija helikaze)\n• Mutacije u genu BLM (15q26.1) za RecQ helikazu.\n• Vrlo rijedak: opisano samo nekoliko stotina slučajeva.\n• Autosomno recesivno nasljeđivanje.\n• Genomska nestabilnost, kromosomski lomovi, neučinkoviti mehanizmi popravka\nDNA.\n• Klinički: nizak rast, teleangiektazije (proširene kapilare) na koži, poremećaj\npigmentacije i preosjetljivost na svjetlost.\n• Sklonost infekcijama i tumorima (česte leukemije).\nProgerija (Hutchinson-Gilfordov sindrom)\nPovezana s ubrzanim skraćivanjem telomera i ubrzanim starenjem:\n• učestalost oko 1 : 4 000 000,\n• mutacije u genu LMNA (1q22) za lamin A,\n• autosomno dominantno nasljeđivanje,\n• ubrzano starenje; simptomi počinju oko 2. godine,\n• alopecija (ćelavost), naborana koža, „kukasti” nos, problemi s vidom, rano\nispadanje zubi,\n• smrt oko 12. godine (ateroskleroza koronarnih i moždanih arterija).\n11. Telomere i replikacija telomera\nŠto su telomere?\nTelomere su krajevi kromosoma. Sastoje se od ponavljajućih sljedova bogatih gvaninom\n(G) koji se ponavljaju tisućama\nUloga: održavanje stabilnosti genoma i linearnosti kromosoma, sprječavanje razgradnje\ni međusobnog sljepljivanja kromosoma.\nTelomere su „ogledalo staničnog starenja” – kod starih stanica kraće su.\nKrajnji dijelovi DNA repliciraju se enzimom telomerazom.\n• Telomeraza je enzimski kompleks koji sadrži vlastitu RNA (kalup) komplementarnu\nponavljajućim telomernim sljedovima.\n• To je reverzna transkriptaza – sintetizira DNA na osnovi RNA kalupa.\nTijek djelovanja:\n1. Telomeraza se veže za jednolančani 3′ kraj vodećeg (kalup) lanca.\n2. Pomoću svog RNA kalupa produljuje 3′ kraj za jednu ponavljajuću jedinicu (i tako\nviše puta).\n3. Produljeni 3′ kraj služi kao kalup: primaza formira početnicu, a DNA polimeraza\nproduljuje zaostajući lanac (nepotpuno sintetizirani zaostajući lanac se\nnadopunjuje)"</script>
<script type="application/json" id="src-p12">"P12 – mejoza\n1. Uvod: stanična dioba i stanični ciklus\nStanična dioba je temeljna osobina života. Prokariotske stanice se dijele binarnom\ndiobom (nespolno, jedna stnica se dijeli na dvije identične), a eukariotske mitozom,\nmejozom ili posebnim ciklusima (npr. višestruka dioba kod ameba).\nStanični ciklus je niz događaja koji se odvijaju u stanici tijekom njenog rasta i diobe. Sastoji\nse od:\n• interfaze (oko 95 % vremena ciklusa): G1, S i G2 faza,\n• diobe stanice (oko 5 %): mitoza ili mejoza.\nStanice koje se više ne dijele izlaze iz ciklusa u fazu G0.\nInterfaza\nRast, priprema za diobu, replikacija DNA. Izgled jezgre: kromosomi su dekondenzirani,\nkromatin je raspoređen po cijeloj jezgri, vidljivi su jezgrina ovojnica i jezgrica.\nFaza Što se događa\nG1 (engl. gap –\nsinteza proteina, RNA i ribosoma; počinje replikacija centriola\nprekid)\nS (engl. semikonzervativna replikacija DNA (svaka novonastala molekula zadržava\nsynthesis) jedan stari tj. roditeljski lanac I jedan novi) , sinteza histona\nG2 sinteza proteina potrebnih za mitozu, kraj diobe centrosoma\nVažnost S faze\nPrije diobe stanica mora udvostručiti DNA. Svaki kromosom iz jedne kromatide\n(jednokromatidni) postaje kromosom od dvije sestrinske kromatide spojene u centromeri\n(dvokromatidni). Broj kromosoma se ne mijenja (i dalje ih je 46), ali količina DNA se\nudvostručuje. Ovo vrijedi i za mitozu i za mejozu: interfaza prije mejoze ima ista događanja\nkao interfaza prije mitoze.\nMitoza\nFaze: profaza, prometafaza, metafaza, anafaza, telofaza. Kariokineza je dioba jezgre, a\ncitokineza dioba citoplazme (počinje u anafazi i završava u telofazi).\n2. Što je mejoza i zašto je važna\nMejoza je dioba stanica kojom nastaju haploidne (n) spolne stanice – gamete.\nSastoji se od dvije uzastopne diobe jezgre i citoplazme, ali samo jedne replikacije DNA (u\nS fazi prije mejoze I):\n• mejoza I = prva mejotička dioba = redukcijska dioba (smanjuje se broj\nkromosoma),\n• mejoza II = druga mejotička dioba = „mejotička mitoza“ (razdvajaju se sestrinske\nkromatide, kao u mitozi).\nRaspodjela kromosoma tijekom mejoze (čovjek)\n• Stanica prije mejoze: 46 kromosoma; nakon S faze svaki kromosom ima 2\nkromatide.\n• Nakon mejoze I: 2 stanice s 23 dvokromatidna kromosoma (haploidne, ali još s\nudvostručenom DNA).\n• Nakon mejoze II: 4 stanice s 23 jednokromatidna kromosoma.\nUloge mejoze\n1. Redukcija broja kromosoma – stvaranje haploidnih gameta (1n).\n2. Preuređenje genoma:\no rekombinacija (crossing-over u profazi I),\no slobodna kombinacija kromosoma (nezavisna segregacija u anafazi I).\nMejoza je preduvjet spolnog razmnožavanja i omogućuje raznolikost organizama.\nZašto gamete moraju biti haploidne?\nPri oplodnji se spajaju jajna stanica (23 kromosoma) i spermij (23 kromosoma) i nastaje\nzigota s 46 kromosoma (23 para). Da su gamete diploidne, svaka bi generacija imala\ndvostruko više kromosoma od prethodne. Samo haploidne gamete daju potomke s\nnormalnim diploidnim (2n) genetičkim sadržajem.\nRazmnožavanje\nRazmnožavanje je proces nastanka novih jedinki iz roditeljskih organizama i osnovno je\nobilježje života. Može biti:\n• nespolno (jednostanični organizmi, hidre, batat) – potomci su genetički identični\nroditelju,\n• spolno (čovjek) – potomstvo nastaje iz dva roditeljska organizma suprotnog spola i\ngenetički je različito od roditelja i od drugih potomaka.\nMejoza osigurava spolno razmnožavanje. Genetička raznolikost igra važnu ulogu u\nopstanku i prilagodljivosti organizama (ako se okoliš promijeni, vjerojatnije je da će neke\njedinke biti prilagođene).\n3. Stanični ciklus mejoze\nRedoslijed:\n1. Interfaza (G1, S, G2)\n2. Mejoza I: profaza I → metafaza I → anafaza I → telofaza I\n3. Interkineza\n4. Mejoza II: profaza II → metafaza II → anafaza II → telofaza II\n4. Mejoza I (redukcijska dioba)\n4.1 Profaza I\nTraje oko 90 % vremena cijele mejoze. U njoj se događaju dva najvažnija procesa:\nsparivanje homolognih kromosoma i rekombinacija. Uz to: spiralizacija kromatina,\nnestajanje jezgrica, raspadanje jezgrine ovojnice, putovanje centrosoma na suprotne\npolove i početak oblikovanja diobenog vretena.\nProfaza I dijeli se na pet podfaza prema morfologiji kromosoma: leptoten, zigoten,\npahiten, diploten, dijakineza.\nLeptoten (kondenzacija kromatina u jezgri)\n• Kromosomi izgledaju kao duge i tanke niti; sestrinske kromatide se ne mogu\nrazlikovati.\n• Stvaraju se dvolančani lomovi DNA molekule, što će omogućiti sparivanje i\nrekombinaciju homolognih kromosoma.\nZigoten\n• Počinje sparivanje (konjugacija) homolognih kromosoma – sinapsa.\n• Događa se na čitavoj dužini kromosoma pomoću sinaptonemskog kompleksa\n• Počinje stvaranje bivalenata (2 kromosoma) odnosno tetrada (4 kromatide).\nSinaptonemski kompleks je proteinski kompleks koji omogućava sparivanje homolognih\nkromosoma. Sastoji se od dva lateralna elementa (uz sestrinske kromatide svakog\nhomologa) i centralnog elementa između njih, kao „patent-zatvarač“.\nSparivanje homolognih kromosoma je najvažniji proces po kojem se razlikuju mitoza i\nmejoza. U mitozi se homolozi ne sparuju. Upravo to omogućava rekombinaciju roditeljskih\n(nesestrinskih) kromatida.\nPahiten\n• Sinaptonemski kompleks je potpuno formiran.\n• Završava rekombinacija i oblikuju se kijazme.\n• Imamo 23 bivalenta (svaki od 2 kromosoma, tj. 4 kromatide): npr. kromosom 1 od\noca (2 kromatide) i kromosom 1 od majke (2 kromatide).\nRekombinacijske kvržice su dijelovi centralnog elementa na kojima se događa crossing-\nover; to su multienzimski kompleksi koji omogućuju izmjenu.\nDiploten\n• Razgrađuje se sinaptonemski kompleks, pa se homolozi počinju razdvajati.\n• Kromosomi spojeni kijazmama.\nDijakineza\n• Terminalizacija kijazmi (kijazme klize prema krajevima kromosoma kao posljedica\nsabijanja kromatina).\n• Kromosomi su maksimalno spiralizirani.\n• Raspada se jezgrina ovojnica – ulazak u metafazu I.\nMnemotehnika: Lijepo Zovem Prijatelje Da Dođu (leptoten, zigoten, pahiten, diploten,\ndijakineza).\n4.2 Crossing-over (rekombinacija)\nCrossing-over je uzajamna izmjena genetičkog materijala između nesestrinskih\nkromatida homolognih kromosoma.\n• U prosjeku se dogodi 2,7 izmjena po homolognom paru kromosoma.\n• Rezultat: nastaju rekombinantne kromatide, koje nose dio gena od oca i dio od\nmajke.\nKijazme su vidljiva mjesta crossing-overa. One:\n• označavaju mjesta rekombinacije,\n• održavaju bivalent na okupu nakon razgradnje sinaptonemskog kompleksa,\n• ključne su za ispravno poravnanje bivalenata u metafazi I i za ispravnu segregaciju u\nanafazi I.\nAbnormalan položaj ili odsutnost kijazmi povezuje se s greškama u razdvajanju\nkromosoma (nondisjunkcija) u mejozi.\nNa jednom bivalentu može biti više kijazmi; svaka nastaje crossingom između dvije\nnesestrinske kromatide (npr. između kromatida 2 i 3, pa između 1 i 3).\nCrossing-over između X i Y kromosoma\nX i Y su samo djelomično homologni. Crossing-over između njih ograničen je na\npseudoautosomalne regije (PAR). Ako se crossing-over dogodi izvan PAR-a, gen SRY\n(odlučuje o razvoju muškog spola) može prijeći s Y na X kromosom. Posljedica:\n• „XX muškarci“ – De la Chapelle sindrom, učestalost oko 1 : 80 000,\n• „XY žene“ – Swyer sindrom, učestalost oko 1 : 20 000 – 1 : 24 000.\n4.3 Metafaza I\n• Bivalenti (ne pojedinačni kromosomi!) postavljaju se u ekvatorijalnu ravninu.\n• Kijazme su ključne za ispravno poravnanje.\nOrijentacija kinetohora\n• Kinetohore sestrinskih kromatida orijentirane su u istom smjeru (djeluju kao\njedna) – za razliku od mitoze.\n• Kinetohore homolognih kromosoma orijentirane su u nasuprotnim smjerovima.\nZato će se u anafazi I razdvojiti homolozi, a ne sestrinske kromatide.\n4.4 Anafaza I\n• Razrješenje kijazmi.\n• Razdvajanje homolognih kromosoma slobodnom kombinacijom – svaki homolog\n(još uvijek dvokromatidni) putuje prema jednom polu.\n• Centromere se ne dijele, a sestrinske kromatide ostaju zajedno.\nSlobodna kombinacija (nezavisna segregacija) kromosoma\nOrijentacija svakog bivalenta u metafazi I je nasumična: majčin ili očev homolog može\nzavršiti na bilo kojem polu, neovisno o tome kako su se rasporedili ostali parovi. Zato svaka\ngameta dobiva slučajnu mješavinu majčinih i očevih kromosoma.\nRačun:\n• 23 para kromosoma → 2²³ = 8 388 608 genotipski različitih gameta kod jedne osobe\n(samo zbog slobodne kombinacije).\n• Oplodnja (spoj dvije gamete): 2²³ × 2²³ = 70 368 744 177 664 (oko 70 trilijuna)\nmogućih kombinacija u zigoti.\n• Tome treba dodati crossing-over (2,7 izmjena po kromosomu), pa je stvarna\nraznolikost praktički neograničena.\nZato su braća i sestre (osim jednojajčanih blizanaca) genetički različiti.\n4.5 Telofaza I\n• Nestaju kinetohorni mikrotubuli, produljuju se polarni mikrotubuli.\n• Formira se jezgrina ovojnica, kromosomi se dekondenziraju.\n• Dovršava se dioba jezgre, slijedi citokineza.\n• Rezultat: 2 haploidne stanice (23 dvokromatidna kromosoma).\n5. Interkineza\n• Razdoblje između prve i druge mejotičke diobe.\n• Nema replikacije DNA (nema S faze!).\n• Razdoblje mirovanja i reorijentacije kinetohora: kinetohore sestrinskih kromatida\nsada se orijentiraju u suprotnim smjerovima, što omogućava njihovo razdvajanje u\nmejozi II.\n6. Mejoza II (mejotička mitoza)\nDvije stanice s haploidnim brojem dvokromatidnih kromosoma dijele se na četiri stanice\ns haploidnim brojem jednokromatidnih kromosoma.\nFaza Što se događa\nProfaza II kromosomi se ponovno kondenziraju, stvara se vreteno\nMetafaza kromosomi (po 23 dvokromatidna) u ekvatorijalnoj ravnini; kinetohore\nII sestrinskih kromatida gledaju u suprotne smjerove\nAnafaza II centromere se dijele, razdvajaju se sestrinske kromatide\nTelofaza II nastaju jezgre, citokineza → 4 haploidne stanice\nMejoza II je slična mitozi. Razlika: stanice su već haploidne, a kromatide koje se razdvajaju\nviše nisu identične (zbog crossing-overa)."</script>
<script type="application/json" id="src-p14">"P14 – kromosomske mutacije\n1. Citogenetika i analiza kromosoma\nCitogenetika je grana biologije koja proučava strukturu kromosoma i njihovo gibanje\ntijekom staničnog ciklusa (interfaza, mitoza, mejoza)\nKariotipizacija\nKariotipizacija je metoda vizualizacije i analize kromosoma. G-pruge su obrazac tamnih i\nsvijetlih pruga po kromosomu, a one su odraz strukture DNA\nRaspršeni metafazni kromosomi – slika kromosoma jedne stanice u metafazi dobivena\nsvjetlosnim mikroskopom.\n• Kariogram – kromosomi jedne stanice posloženi prema veličini u homologne\nparove.\n• Idiogram – grafički prikaz opruganih (G-pruge) homolognih kromosoma u kariotipu.\n• Kariotip – kromosomska garnitura jedne jedinke (2n).\n• Mozaičan kariotip – dvije ili više staničnih linija s različitim kariogramima u istoj\nosobi, npr. 45,X/46,XX.\nHumani kariotip\nNormalan kariotip je euploidan (ispravan broj kromosoma): 22 para autosoma (homologni\nkromosomi, grupe A–G) + 1 par spolnih kromosoma (XX u žene, XY u muškarca).\n2. Numeričke aberacije kromosoma (promjene broja)\nNumeričke aberacije mijenjaju fenotip\nDijele se na dvije vrste:\n• Aneuploidija – višak ili manjak pojedinog kromosoma (ne cijelog seta): trisomija\n(2n + 1; tri kopije kromosoma) i monosomija (2n – 1; samo jedna kopija).\n• Poliploidija – višak cijelih kromosomskih garnitura (npr. 3n = 69, triploidija; 4n = 92,\ntetraploidija).\n2.1. Numeričke aberacije autosoma (trisomije)\nSindrom Kariotip Kromosom\nDownov 47,XX,+21 ili 47,XY,+21 trisomija 21\nPatauov 47,XX,+13 ili 47,XY,+13 trisomija 13\nEdwardsov 47,XX,+18 ili 47,XY,+18 trisomija 18\nDownov sindrom (trisomija 21)\nNajčešća autosomna trisomija. Glavne značajke:\n• razvojno i intelektualno zaostajanje,\n• tipična kraniofacijalna dismorfija: brahicefalija (kratka, široka glava), epikantus\n(kožni nabor na unutarnjem kutu oka), koso položene oči, male i loše formirane\nuške,\n• prirođene srčane greške, anomalije bubrega i crijeva,\n• hipotonija mišića u novorođenačkoj dobi,\n• brazda četiri prsta (jedna poprečna dlanska brazda),\n• širok razmak između prvog i drugog prsta na nogama.\nOralne značajke (važno za stomatologiju): velik, izbrazdan jezik; malokluzija (poremećaj\nnormalne okluzije/zagriza); mali zubi, prirođeno nedostajanje zubi; problemi s čeljusti i\nzagrizom, komplikacije sa žvakanjem; neučinkovito prirodno čišćenje usne šupljine; zbog\ntoga parodontna bolest, zubni karijes i hiperplazija gingive.\nPatauov sindrom (trisomija 13)\nMikrocefalija, anoftalmija/mikroftalmija (nedostatak/malo oko), rascjep usne, čeljusti i\nnepca, polidaktilija (višak prstiju) i malformacije unutarnjih organa.\nEdwardsov sindrom (trisomija 18)\nDolikocefalija (duga, uska glava), fleksijske kontrakture prstiju (2. prst preko 3., 5. prst\npreko 4.), \"rocker-bottom\" stopalo (zaobljeno stopalo, kao dno ljuljačke) te malformacije\nsrca, bubrega i probavnog trakta.\n2.2. Numeričke aberacije gonosoma (spolnih kromosoma)\nSindrom Kariotip Vrsta\nTurnerov 45,X monosomija X\nKlinefelterov 47,XXY (ili 48,XXXY) trisomija\nTriplo-X 47,XXX trisomija\nDvostruki Y 47,XYY trisomija\nTurnerov sindrom (45,X)\nOsobe su ženskog spola s jednim X kromosomom. Značajke:\n• disgeneza gonada, hipogonadizam, izostanak razvoja sekundarnih spolnih\nkarakteristika, primarna amenoreja i neplodnost,\n• nizak rast (prosječna visina oko 143 cm),\n• cubitus valgus (valgus laktova), široko razmaknute prsne bradavice,\n• limfni edemi ruku i nogu (osobito u novorođenčeta),\n• lateralni kožni nabor na vratu (pterigij) i nizak korijen kose na vratu.\nRaspodjela kariotipova u Turnerovu sindromu:\nKariotip Udio Opis\n45,X 40–50 % monosomija X\n45,X/46,XX 15–25 % mozaičan kariotip\n45,X/47,XXX; 45,X/46,XX/47,XXX oko 3 % mozaik više staničnih linija\n45,X/46,XY 10–12 % gonadna disgeneza\nKlinefelterov sindrom (47,XXY)\nOsobe muškog spola s dodatnim X kromosomom. Hipergonadotropni hipogonadizam\n(male testise, visoke razine gonadotropina), ginekomastija (razvoj dojki), neplodnost –\nazoospermija. Često su visoki.\nDvostruki Y sindrom (47,XYY)\nMuškarci su fizički normalni; mogu imati probleme s govorom, hiperaktivnost, normalan ili\nsnižen IQ. Moguće su i razvojne poteškoće u komunikaciji i društvenoj interakciji: ADHD,\ndepresija, anksioznost, poremećaj iz autističnog spektra.\nTriplo-X (47,XXX)\n3. Mehanizmi nastanka aneuploidije i poliploidije\nGlavni uzrok je nepravilno razdvajanje kromosoma tijekom mejoze ili mitoze, odnosno:\n• nerazdvajanje (nondisjunkcija)\n• anafazno\nPodjela po trenutku nastanka:\n• primarno – zametna stanica je euploidna, a greška nastaje u diobi,\n• sekundarno – zametna stanica je već aneuploidna.\n3.1. Normalna mejoza\nStanica 2n (46) nakon MI daje dvije stanice n (23) s udvojenim kromosomima, a nakon MII\nčetiri haploidne gamete n (23), svaka s jednim kromosomom 21.\n3.2. Nerazdvajanje u prvoj mejotičkoj diobi (MI)\nHomologni kromosomi ne odlaze u različite stanice. Rezultat: dvije gamete n+1 (imaju oba\nhomologa) i dvije gamete n–1 (nemaju kromosom). Nakon oplodnje: gameta n+1 daje\ntrisomiju, gameta n–1 monosomiju.\n3.3. Nerazdvajanje u drugoj mejotičkoj diobi (MII)\nNe razdvajaju se sestrinske kromatide jedne stanice. Rezultat: jedna gameta n+1, jedna n–\n1, a dvije normalne (n).\n3.4. Nepravilno razdvajanje u mitozi → mozaicizam\nAko se greška dogodi u mitotičkoj diobi zigote (nakon oplodnje), nastaju stanične linije s\nrazličitim brojem kromosoma. Osoba je tada mozaik.\n• 46,XX → 47,XXX + 45,X → 47,XXX/45,X (mozaik).\n• Ranije u razvoju greška = veći udio izmijenjenih stanica; ako se greška dogodi u\nkasnijoj diobi (npr. drugoj), mozaik je 47,XXX/45,X/46,XX (uz normalne stanice).\n• Primjer: 46,XY → 47,XXY / 46,XY (mozaični Klinefelter); 46,XX → 47,XX,+21/46,XX\n(mozaični Downov sindrom).\n• Ponekad je jedna linija nesposobna za život (u slici prekrižena) pa preživi samo\njedna.\n3.5. Poliploidija\nNastaje:\n• spajanjem nereduciranih gameta (žene ili muškarca; gameta s 2n kromosoma),\n• polispermijom (oplodnja s više spermija),\n• supresijom prvog ili drugog polarnog tijela u oogenezi,\n• supresijom zigote u kojoj se nakon kariokineze (diobe jezgre) nije dogodila\ncitokineza (diobe citoplazme).\nPoliploidije su u čovjeka u pravilu povezane s ranim spontanim pobačajima.\n4. Strukturne aberacije kromosoma\nDijele se prema količini genetičkog materijala:\nBalansirane Nebalansirane\nGenetički\nnema gubitka ni viška gubitak ili višak\nmaterijal\nuzrokuju promjenu fenotipa (razvojno i\nne uzrokuju promjenu fenotipa intelektualno zaostajanje, dismorfije,\nFenotip\n– osoba je mirni nosilac malformacije organa, abnormalnosti\nvanjskog spolovila)\nde novo ili nasljeđuju od roditelja\nNastanak (obiteljske translokacije); u općoj –\npopulaciji ~1 od 500\nstvaranje nebalansiranih\nRizik –\ngameta (rizik za potomstvo)\nVrste strukturnih promjena\n• Intrakromosomske: delecije (del), izokromosom (i), inverzije (inv).\n• Interkromosomske: recipročne translokacije (t) i Robertsonove translokacije\n(der).\n5. Intrakromosomske strukturne promjene\n5.1. Delecije (del) – nebalansirane\nGubitak dijela kromosoma. Odlomljeni acentrični fragment (bez centromere) ne veže se\nna diobeno vreteno pa se gubi u novoj stanici.\n• Intersticijska – gubi se središnji dio kraka\n• Terminalna – gubi se kraj kromosoma\n• Obokraka terminalna – prstenasti (ring) kromosom: lom na oba kraja, acentrični\nfragmenti se gube, a preostali krajevi se spoje u prsten.\n5.2. Izokromosom (i) – nebalansiran\n5.3. Inverzije (inv) – balansirane\nDio kromosoma se okrene za 180° (lom na dva mjesta). Dvije vrste:\n• paracentrična – inverzija ne obuhvaća centromeru (oba loma u istom kraku),\n• pericentrična – inverzija obuhvaća centromeru (lomovi u p i q kraku\n6. Interkromosomske strukturne promjene\n6.1. Recipročne translokacije (t) – balansirane\nDva nehomologna kromosoma razmijene dijelove (uzajamna razmjena). Ništa se ne gubi\npa je nositelj fenotipski normalan (mirni nosilac).\nMejoza kod nosioca: u pahitenu se kromosomi sparuju u kvadrivalent (križni oblik).\nRazdvajanje može biti 2:2 ili 3:1. Kod razdvajanja 2:2 nastaju gamete:\n• balansirane – normalne ili s uravnoteženom translokacijom (isti kariotip kao\nroditelj),\n• nebalansirane – s viškom jednog i manjkom drugog segmenta; nakon oplodnje\nzigota je nebalansirana (spontani pobačaj ili dijete s malformacijama i\nintelektualnim zaostajanjem).\n6.2. Robertsonova translokacija (der) – balansirana\nNastaje spajanjem dva akrocentrična kromosoma (13, 14, 15, 21 i 22) lomom u području\ncentromere (q10) i spajanjem dugih krakova. Gubi se mali dio (kratki krakovi) pa nastaje\njedan derivirani kromosom (der). Ukupno je 45 kromosoma, a nositelj je fenotipski\nnormalan.\nPodjela:\n• heterologna – spajaju se različiti akrocentrici, npr. 45,XY,der(14;21)(q10;q10),\n• homologna – spajaju se isti kromosomi, npr. 45,XX,der(21;21)(q10;q10).\nMejoza: u pahitenu nastaje trivalent (npr. 14, 21 i der(14;21)).\nHeterologna Robertsonova translokacija i Downov sindrom translokacijskog tipa\nMirni nosilac der(14;21) stvara gamete 2:2 razdvajanjem; neke su balansirane, a neke\nnebalansirane. Nebalansirana gameta nosi der(14;21) i normalni 21. Nakon oplodnje\nnastaje potomak s kliničkom slikom Downova sindroma translokacijskog tipa:\n46,XY,der(14;21)(q10;q10),+21 (ukupno 46 kromosoma, ali s trostrukim materijalom\nkromosoma 21).\nHomologna Robertsonova translokacija\nNosilac 45,XX,der(21;21)(q10;q10) stvara samo dvije vrste gameta: onu s der(21;21) i onu\nbez kromosoma 21. Sve su gamete nebalansirane. Nakon oplodnje:\n• gameta der(21;21) + normalna gameta s 21 → Downov sindrom translokacijskog\ntipa 46,XY,der(21;21)(q10;q10),+21,\n• gameta bez 21 + normalna gameta → monosomija 21, nespojivo sa životom.\nPravila čitanja: prvo ukupan broj kromosoma, zatim spolni kromosomi; + označava višak, –\nmanjak; p = kratki krak, q = dugi krak; del, i, inv, t, der, r označavaju vrstu strukturne\npromjene."</script>
<script type="application/json" id="src-p16">"P16/17 – transkripcija i obrada mRNA\n1. Što je transkripcija\nTranskripcija je sinteza RNA: proces stvaranja jednolančane RNA koja je\nkomplementarna jednom lancu dvostruke DNA uzvojnice.\nSredišnja (centralna) dogma molekularne biologije : jednosmjerni protok genetičke\ninformacije DNA → RNA → protein. Transkripcija je prvi korak u ekspresiji gena, a\ntranslacija drugi.\nProkarioti i eukarioti: osnovna razlika\nProkarioti Eukarioti\ntranskripcija u jezgri, translacija\ntranskripcija i translacija u istom\nGdje u citoplazmi (prostorno i\nodjeljku (citoplazmi), istodobno\nvremenski odvojene)\nprimarni transkript (pre-mRNA) se\nDorada gotovo nikakva – mRNA se prevodi\ndorađuje (kapa, poli-A rep,\nmRNA odmah, još tijekom transkripcije\nizrezivanje introna)\nčesto policistronska (jedna\nVrsta monocistronska (1 gen → 1 mRNA\nmRNA kodira više proteina,\nmRNA → 1 protein)\nprepisana s više susjednih gena)\n2. Osnovni pojmovi transkripcije\nKodirajući i kalup lanac\n• Kalup lanac (nekodirajući): služi kao kalup za sintezu RNA; čita se u smjeru 3′→5′.\n• Kodirajući lanac: ima isti slijed kao nastala RNA (uz razliku: T umjesto U), smjer\n5′→3′.\nRNA se sintetizira u smjeru 5′→3′: nukleotidi se dodaju na 3′ kraj rastućeg lanca RNA.\nRNA-polimeraza\n• enzim transkripcije; za razliku od DNA polimeraze ne treba početnicu\n• kreće se duž kalup lanca i dodaje ribonukleozid-5′-trifosfate (rNTP) prema pravilu\nkomplementarnosti baza\nTranskripcijska jedinica je dio DNA koji kodira jednu RNA molekulu i ima sljedove\npotrebne za njezin pravilan prijepis. Uključuje:\n1. promotor,\n2. RNA-kodirajuću regiju,\n3. terminator.\n• Promotor: DNA slijed duljine 100–1000 pb, smješten uzvodno (upstream) od gena,\nblizu startnog mjesta transkripcije (+1). Na njega se veže RNA polimeraza –\npočetak transkripcije.\n• Terminator: slijed duljine 20–200 pb koji označava kraj gena i vodi do odvajanja\nRNA od DNA kalupa (kraj transkripcije).\n3. Transkripcija u prokariota\nTri faze: inicijacija, elongacija, terminacija.\nRNA polimeraza u prokariota\n• isti enzim prepisuje sve vrste RNA,\n• u E. coli ima šest podjedinica\n• σ (sigma) podjedinica je slabo vezana i može se odvojiti; nužna je za\nprepoznavanje ispravnog inicijacijskog mjesta (promotora),\n• preostalih pet podjedinica čini srž (core) koja ima katalitičku aktivnost.\nPromotor u prokariota\nU E. coli promotor ima dva karakteristična slijeda na pozicijama −10 i −35 (broj parova\nbaza uzvodno od startnog mjesta +1). Na njih se veže σ podjedinica.\nFaze\n1. Inicijacija:\n• zatvoreni kompleks promotora: RNA polimeraza (sa σ) vezana je na DNA, ali se\nDNA još nije otvorila,\n• vezanje σ na elemente −10 i −35 → otvoreni kompleks promotora: DNA se\nodmotava oko mjesta inicijacije,\n• zatim započinje sinteza RNA.\n2. Elongacija: RNA polimeraza se pomiče duž DNA i produljuje lanac RNA. Dok se\nkreće, odmotava DNA ispred sebe i ponovno zamata DNA iza sebe, tako da\nodmotano područje („transkripcijski mjehur”) ostaje veličine oko 15 bp.\n3. Terminacija: signalizirana je obrnutim ponavljanjima bogatim GC-parovima iza\nkojih slijedi niz A (na kalup lancu). Obrnuta ponavljanja u RNA se sparuju i stvaraju\nomču (ukosnicu/hairpin), što uzrokuje odvajanje RNA od DNA kalupa.\n4. Transkripcija u eukariota\nSloženija je nego u prokariota; faze su iste (inicijacija s preinicijacijskim kompleksom,\nelongacija, terminacija), a glavni čimbenici su:\n• promotor / DNA,\n• RNA polimeraze,\n• proteini (transkripcijski faktori),\n• kromatinska struktura (DNA je zapakirana u kromatin pa je dostupnost kalupa\nograničena).\nEukariotske RNA polimeraze\nEukarioti imaju različite RNA polimeraze za različite vrste RNA. To su enzimi s 12–17\npodjedinica koji prepoznaju različite promotore i dijele zajedničke značajke jedni s\ndrugima (i s bakterijskom polimerazom).\nVrsta RNA RNA polimeraza\nmRNA, miRNA, lncRNA II\ntRNA III\nrRNA 5.8S, 18S, 28S I\nrRNA 5S III\nmitohondrijski geni mitohondrijska polimeraza\ngeni kloroplasta kloroplastna polimeraza\n(snRNA – mala jezgrina RNA; lncRNA – duga nekodirajuća RNA; miRNA – mikroRNA.)\nEukariotski promotori za sintezu mRNA\nSvaki gen ima promotor (DNA koja neposredno okružuje početno mjesto transkripcije).\nElementi:\n• TATA-slog (TATAA): smješten oko 25–30 nukleotida uzvodno od +1; to je cis-\nregulatorni element; prvi identificirani slijed, ali ga ima najviše oko 30 % promotora\nRNA polimeraze II,\n• Inr elementi: obuhvaćaju mjesto početka transkripcije,\n• još nekoliko uzvodnih i nizvodnih elemenata.\nRazličiti geni sadrže različite kombinacije promotorskih elemenata.\nTranskripcijski faktori (TF)\nOko 10 % ljudskog genoma kodira transkripcijske faktore. Dijele se na:\n• Opći transkripcijski faktori (TFII: TFIID, TFIIB, TFIIF, TFIIE, TFIIH): vežu se na\npromotor i nužni su RNA polimerazi II za početak transkripcije; aktivni su na svim\npromotorima polimeraze II.\n• Specifični transkripcijski faktori: vežu se na regulatorne sekvence (pojačivače i\nutišivače) i promotore pojedinih gena te kontroliraju njihovu gensku ekspresiju.\nStvaranje preinicijacijskog kompleksa RNA polimeraze II\n1. TBP (TATA-vezujući protein), podjedinica faktora TFIID, veže se na TATA-slog (uz\nTAF proteine, TBP-associated factors) – time započinje stvaranje transkripcijskog\nkompleksa.\n2. Veže se još jedan opći faktor (TFIIB), zatim RNA polimeraza II (s TFIIF).\n3. Potom se vežu ostali opći faktori (TFIIE, TFIIH).\nMediator i početak transkripcije\n• Za učinkovitu transkripciju pridružuje se kompleks Mediator (više od 20\npodjedinica) koji povezuje polimerazu II, opće TF i regulatorne proteine.\n• Mediator se veže na CTD podjedinicu (C-terminalnu domenu najveće podjedinice\nRNA polimeraze II).\n• TFIIH (ima helikaznu aktivnost: otvara DNA) fosforilira CTD; nakon te fosforilacije\nMediator se oslobađa i transkripcija započinje.\n• Na fosforilirani CTD vežu se faktori elongacije i procesiranja (dorade) mRNA.\nTerminacija u eukariota\nPolimeraza II nema terminacijski signal kao prokarioti:\n• primarni transkript se otpušta nakon prijepisa poliadenilacijskog signala\n(AAUAAA) i nizvodne sekvence bogate GU ili U,\n• signal prepoznaje kompleks specifičnih faktora za kidanje i poliadenilaciju,\n• endonukleaza kida transkript 10–30 nukleotida nizvodno od signala (obično na CA\nslijedu),\n• potom slijedi dorada pre-mRNA.\n5. Dorada (procesiranje) pre-mRNA u eukariota\nVećina primarnih RNA transkripata (pre-RNA) dorađuje se u funkcionalni oblik. Iznimka\nje mRNA u prokariota koja se prevodi odmah. Najveća razlika prokariota i eukariota\nje upravo u doradi mRNA: zaštita 5′ i 3′ kraja i izrezivanje introna. Dorada se zbiva u\njezgri.\n5.1. 5′ kapa (7-metilgvanozin)\n• nastaje dodavanjem GTP-a na 5′ kraj i metiliranjem gvanina (m7G); metilne\nskupine dodaju se i na riboze prvog ili prvih dvaju nukleotida,\n• zaštićuje 5′ kraj od razgradnje (stabilizira molekulu),\n• važna za početak translacije (vezanje mRNA na ribosome).\n5.2. Poliadenilacija (3′ kraj)\n• Endonukleaza cijepa pre-mRNA 10–30 nukleotida nizvodno od AAUAAA (na CA\nslijedu), a poli-A polimeraza dodaje poli-A rep (oko 200–300 adenina) na 3′ kraj.\n• Uloga: regulira translaciju i stabilnost mRNA (npr. kontrola translacije u ranom\nembrionalnom razvoju).\n5.3. Prekrajanje (splicing)\nIntroni (nekodirajući dijelovi) izrezuju se, a egzoni (kodirajući dijelovi) spajaju u\nkontinuirani kodirajući slijed.\nGdje: u jezgri, u spliceosomima (tjelešca za prekrajanje), velikim kompleksima snRNA\ni proteina (snRNP = small nuclear ribonucleoprotein particles). U jezgri postoje i\njezgrine pjege (speckles) – odjeljci za splicing faktore.\nDva ključna koraka:\n1. Kidanje na 5′ mjestu prekrajanja i spajanje 5′ kraja introna na adenin unutar\nintrona (točka grananja) → nastaje intronska petlja u obliku lasa (lariat).\n2. Kidanje na 3′ mjestu prekrajanja i spajanje susjednih egzona; izrezana intronska\npetlja se razgrađuje.\nsnRNA (U1, U2, U4, U5, U6; građene od 50–200 nukleotida) prepoznaju usaglašene\n(konsenzus) sljedove na 5′ i 3′ mjestima prekrajanja i izravno kataliziraju reakciju – dakle\nsnRNA su ribozimi (RNA s katalitičkom aktivnošću).\nSastavljanje spliceosoma:\n1. U1 snRNP se veže na 5′ mjesto prekrajanja, a U2 snRNP na točku grananja.\n2. Kompleks U4/U6 i U5 ulazi u spliceosom.\n3. U4 i U1 se odvajaju, a U6 katalizira stvaranje lasastog intermedijara i ligaciju\n(spajanje) egzona.\n5.4. Alternativno prekrajanje\nIsta pre-mRNA može se obraditi na različite načine: egzoni se spajaju u različitim\nkombinacijama, pa iz jednog gena nastaje više mRNA i više proteina. To je važno za\nregulaciju genske ekspresije i objašnjava zašto je broj proteina veći od broja gena.\n7. Regulacija genske ekspresije\nGenska ekspresija je proces kojim se informacija iz gena koristi za stvaranje\nfunkcionalnog produkta (RNA i proteina).\nGotovo sve stanice jedne osobe sadrže istu DNA – zašto izgledaju i rade različito?\nZbog različite regulacije gena: u prosječnoj diferenciranoj stanici čovjeka aktivno je\noko 10–20 % od ~20 000 gena.\nRazine regulacije\n1. epigenetska,\n2. transkripcijska,\n3. post-transkripcijska,\n4. translacijska,\n5. post-translacijska.\nGeni su regulirani prvenstveno na razini transkripcije, ali kontrola je moguća u bilo\nkojem koraku ekspresije.\nŠto određuje regulaciju transkripcije?\n• vrsta, broj, položaj i kombinacija regulatornih elemenata u i oko promotora,\n• dostupnost i aktivnost transkripcijskih faktora (središnja uloga TF),\n• preuređenje kromatina i time povezana dostupnost promotora (DNA je u\nkromatinu pa je kao kalup ograničeno dostupna).\nPojačivači i utišivači\n• Pojačivači (enhanceri) + aktivatori transkripcije → povećavaju brzinu transkripcije\n(up-regulacija).\n• Prigušivači (silenceri) + represori → smanjuju brzinu transkripcije (down-\nregulacija).\nTi se elementi mogu nalaziti daleko od gena; DNA se savija u petlju koju stabilizira\nprotein kohezin, a nastaje interakcijom općih i specifičnih TF te kompleksa Mediator\n– tako udaljeni regulatorni elementi dolaze u dodir s promotorom.\nMikroRNA (miRNA): post-transkripcijski nadzor\n• nekodirajuće RNA molekule duljine 21–24 nt; nadziru ekspresiju velikog broja\ngena u čovjeka,\n• geni za miRNA nalaze se na svim kromosomima osim Y, u intergenskim područjima\ni intronima, često u skupinama,\n• mehanizam: miRNA je djelomično komplementarna ciljnoj mRNA, stvara RNA-\nRNA hibrid (dvolančana RNA) → represija translacije i/ili razgradnja mRNA.\n8. Epigenetika\nDefinicije:\n• proučavanje procesa kojima genotip daje fenotip.\n• promjene aktivnosti gena tijekom razvoja općenito se nazivaju epigenetskima.\n• Epigenetika je znanost o nasljednom i reverzibilnom nadzoru aktivnosti gena koji\nne uključuje promjenu slijeda nukleotida u DNA.\nObilježja:\n• modifikacije DNA koje ne mijenjaju slijed DNA, ali mijenjaju\ntranskripciju/ekspresiju gena,\n• stabilne promjene u ekspresiji gena uzrokovane promjenama u strukturi\nkromatina,\n• proučava utjecaj okoliša (prehrana, agensi, starenje…) na gensku aktivnost i\nmeđugeneracijski prijenos tog utjecaja.\nEpigenetske modifikacije:\n• djelomično nasljedne – stabilne kroz mitozu (unutar organizma), a dijelom i kroz\nmejozu (iz generacije u generaciju),\n• reverzibilne – mijenjaju se tijekom života pod utjecajem okoliša,\n• djeluju kao prekidači: potiču ili sprječavaju aktivnost gena potrebnih za\ndiferencijaciju i funkciju određene stanice te održavaju tkivno specifičnu aktivnost\ngena.\nGenomski upis (genomic imprinting)\nEpigenetska pojava kod koje se ovisno o roditeljskom podrijetlu ekspresija gena\nrazlikuje (utišan je alel jednog roditelja). Primjeri s predavanja: parcijalna mola\nhidatidoza i uniparentna disomija\nMehanizmi epigenetskih modifikacija\n1. DNA metilacija,\n2. modifikacije histona,\n3. nekodirajuće RNA molekule.\nSve one dovode do remodelacije kromatina (kromatin postaje više ili manje dostupan\ntranskripciji).\n1. DNA metilacija: kovalentno vezanje metilne skupine (CH₃) na DNA, RNA, proteine\nili lipide. U sisavaca se na DNA metilna skupina dodaje samo na citozine u CpG\ndinukleotidima (u velikom utoru DNA), pri čemu nastaje 5-metilcitozin. (Općenito,\nmetilacija CpG-a u promotoru povezana je s utišavanjem gena.)"</script>
<script type="application/json" id="src-p18">"P18 – translacija\n1. Što je translacija i gdje se odvija\nTranslacija je proces u kojem mRNA nosi kod za određeni slijed aminokiselina koje\ngrade protein. To je druga razina genske ekspresije (prva je transkripcija), prema\nsredišnjoj dogmi molekularne biologije: DNA → RNA → protein.\nGdje se odvija? U citoplazmi, na ribosomima:\n• prokarioti: transkripcija i translacija zbivaju se u istom odjeljku, istodobno\n(translacija započinje još dok traje transkripcija),\n• eukarioti: translacija je u citoplazmi, a mRNA je prethodno prepisana i obrađena u\njezgri. Ribosomi su ili slobodni u citosolu ili vezani za membranu\nendoplazmatskog retikuluma (ER-a).\n2. Odnos DNA, mRNA i proteina\n• Kodirajući lanac DNA je identičan mRNA (uz razliku: T umjesto U).\n• Kalup lanac DNA je komplementaran i antiparalelan mRNA.\n• mRNA se prevodi u smjeru 5′ → 3′.\nPeptidna veza\nAminokiseline (Ak) povezuju se peptidnom vezom: karboksilna skupina jedne Ak\npovezuje se s amino skupinom druge Ak. Polipeptidni lanac sintetizira se u smjeru od N-\nkraja (amino, NH₂) prema C-kraju (karboksilni, COOH).\nRazlika prokariotske i eukariotske mRNA\n• Prokarioti: mRNA je često policistronska (kodira više proteina).\n• Eukarioti: zrela mRNA je monocistronska (kodira samo jedan protein).\n• UTR (untranslated regions) – dijelovi mRNA na 5′ i 3′ kraju koji se ne prevode.\n3. Genetički kod\nmRNA se „čita“ prema genetičkom kodu koji povezuje slijed DNA sa slijedom\naminokiselina u proteinima.\n• KOD = tri baze u DNA.\n• KODON = tri baze u mRNA. Kodon je komplementaran i antiparalelan kodu u DNA.\nSvaki kodon opisuje određenu aminokiselinu.\nZašto triplet? (dokazi)\nLogički: za 20 aminokiselina treba dovoljno kombinacija: 1 nukleotid daje 4 kombinacije, 2\nnukleotida 16, a 3 nukleotida 64 kombinacije – prvi broj koji je dovoljan. Zato je kodon\ntriplet.\nOd 64 kodona, 61 kodira aminokiseline\n• Početni (start) kodon: AUG – kodira metionin (Met); prvi prevedeni kodon.\n• STOP kodoni: UAA, UAG i UGA – signaliziraju završetak translacije i ne specificiraju\naminokiseline.\nObilježja genetičkog koda\nObilježje Značenje\nRedundancija jedna aminokiselina može biti kodirana s više od jednog\n(degeneriranost) kodona\nNedvosmislenost isti kodon ne kodira dvije ili više različitih aminokiselina\nGotovo univerzalnost isti kod koristi gotovo sva živa bića\nZnačenje univerzalnosti: jedan je od najjačih dokaza da sva živa bića dijele zajedničko\nevolucijsko nasljeđe.\n4. Transportna RNA (tRNA) – adapter\n• tRNA je duga 70–80 nukleotida, a zbog komplementarnog sparivanja baza između\nrazličitih regija ima strukturu lista djeteline (u prostoru oblika slova L).\n• Adapterska funkcija ostvaruje se preko dvije odvojene regije:\no antikodon – veže se na komplementarni kodon u mRNA,\no CCA regija na 3′ kraju – tu se veže aminokiselina koja odgovara kodonu.\n• Stanice sadrže oko 40 različitih tRNA koje služe kao akceptori za 20 različitih\naminokiselina.\nAktivacija aminokiseline – aminoacil-tRNA sintetaza\nAminokiselinu na odgovarajuću tRNA veže enzim aminoacil-tRNA sintetaza, uz ATP:\n1. aminokiselina se spaja na AMP (nastaje aminoacil-AMP intermedijer),\n2. aminokiselina se prenosi na hidroksilnu (OH) skupinu riboze na 3′ kraju tRNA (3′\nCCA) → nastaje aminoacil-tRNA („nabijena“ tRNA).\nStanice imaju različite sintetaze za svaku aminokiselinu; to su visoko selektivni enzimi.\nIspravna ugradnja aminokiseline u polipeptid ovisi o dva koraka: o vezanju aminokiseline\nna ispravnu tRNA (sintetaza) i o kodon–antikodon sparivanju baza.\nPeptidil-tRNA\nPeptidil-tRNA je tRNA na koju je vezan rastući polipeptid. Pri elongaciji se stvara peptidna\nveza između C-kraja zadnje aminokiseline na peptidil-tRNA i N-kraja aminokiseline\nvezane na aminoacil-tRNA.\nReakcija peptidil transferaze\nRastući polipeptid prenosi se s peptidil-tRNA na aminokiselinu aminoacil-tRNA (peptidni\nlanac se produžuje za jednu Ak). Tu reakciju katalizira centar peptidil transferaze u velikoj\nribosomskoj podjedinici.\n5. Wobble – kolebanje pri sparivanju\nNeke tRNA prepoznaju više od jednog kodona zbog nestandardnog sparivanja baza\n(kolebanja, wobble) između antikodona tRNA i trećeg položaja kodona. Sparivanje\nkodon–antikodon na trećem položaju je manje strogo od standardnog A–U i G–C.\n• npr. guanin (G) može se sparivati s uracilom (U) (G–U par),\n• inozin (I) (nastaje deaminacijom adenozina; do 10 % baza u tRNA) može se\nsparivati s U, C i A.\n6. Ribosom\nRibosom se sastoji od velike i male podjedinice, a svaka sadrži ribosomske proteine i\nrRNA.\n• Mala podjedinica: mjesto vezanja mRNA; rRNA male podjedinice (30S/40S) ima\ncentar za dekodiranje (osigurava vjernost kodon–antikodon interakcije i razlikuje\npogrešno sparivanje).\n• Velika podjedinica: tri mjesta za vezanje tRNA – A, P i E; rRNA velike podjedinice\n(50S/60S) ima aktivnost peptidil transferaze (stvaranje peptidne veze).\nMjesto Naziv Funkcija\nA aminoacil ulazi nova aminoacil-tRNA\nP peptidil tRNA s rastućim polipeptidom\nE izlaz (exit) deacilirana tRNA napušta ribosom\nProkarioti Eukarioti\nVelika podjedinica 50S 60S\nMala podjedinica 30S 40S\nCijeli ribosom 70S 80S\nrRNA je ribozim – ima katalitičko djelovanje, slično enzimima.\n7. Tri glavne faze translacije\nTranslacija ima tri faze: inicijacija, elongacija i terminacija. U njoj surađuju mRNA, tRNA,\nribosom/rRNA i brojni translacijski proteini (translacijski faktori), a mRNA se čita u smjeru\n5′→3′.\n7.1. Inicijacija – usporedba prokariota i eukariota\nProkarioti Eukarioti\nKako se Shine–Dalgarno slijed u mRNA mRNA se na malu podjedinicu veže\nmRNA (ispred AUG) sparuje se s preko 7-metilgvanozinske kape (5′\nporavna na komplementarnim slijedom blizu 3′ kraj); mala podjedinica skenira mRNA\nribosom kraja rRNA male podjedinice dok ne naise na prvi AUG\nKoraci inicijacije (eukarioti):\n1. Inicijatorska tRNA (metionil-tRNA) veže se na malu ribosomsku podjedinicu (uz\ninicijacijske faktore, IF).\n2. Mala podjedinica + metionil-tRNA + inicijacijski faktori vežu se na 5′ kraj mRNA i\nskeniraju niz mRNA u smjeru 3′ dok ne pronađu start kodon AUG.\n3. Velika podjedinica se pridružuje kompleksu, a metionil-tRNA smješta se na P\nmjesto.\n7.2. Elongacija\nAminoacil-tRNA dolazi do ribosoma uz faktor elongacije (eEF1α) vezan s GTP-om.\n1. Druga tRNA (koju nosi faktor elongacije) sparuje se sa sljedećim kodonom na A\nmjestu.\n2. Aminokiselina (polipeptid) s P mjesta veze se peptidnom vezom za aminokiselinu\nna A mjestu – djelovanjem peptidil transferaze velike podjedinice.\n3. Translokacija: ribosom se pomiče duž mRNA za tri nukleotida (jedan kodon) u\nsmjeru 5′→3′; deacilirana tRNA prelazi na E mjesto i oslobođava se, a tRNA s\npeptidnim lancem premješta se na P mjesto. A mjesto je slobodno za sljedeću\naminoacil-tRNA.\nCiklus se ponavlja za svaki kodon.\n7.3. Terminacija\n1. Elongacija traje dok se stop kodon (UAG, UAA ili UGA) ne translocira na A mjesto.\n2. Stanice nemaju tRNA s antikodonima komplementarnim stop kodonima, nego\nfaktore otpuštanja (RF, release factors) koji prepoznaju terminacijske signale.\n3. Faktori otpuštanja hidroliziraju vezu između gotovog polipeptida i tRNA na P\nmjestu; polipeptid i tRNA se oslobođaju, a mRNA i ribosom disociraju\n(podjedinice, tRNA i mRNA se razdvajaju i recikliraju).\n8. Polisomi (poliribosomi)\nJedna mRNA prevodi se istodobno nizom više ribosoma – polisom (poliribosom), a\nribosomi su na udaljenosti od oko 100–200 nukleotida. Ribosomi bliže 3′ kraju mRNA\nimaju duže polipeptidne lance (već su dalje u prijevodu). Time se iz jedne mRNA brzo\ndobije mnogo kopija proteina."</script>
<script type="application/json" id="src-p19">"P19 – smatanje, dorada i regulacija proteina\nKamo proteini idu nakon sinteze?\nProteini se sintetiziraju na dva mjesta u stanici:\n• Slobodni ribosomi u citosolu → proteini ostaju u citosolu ili se prenose u jezgru,\nmitohondrije, kloroplaste ili peroksisome.\n• Ribosomi vezani za membranu ER-a → translacija se nastavlja na ER-u pa protein\nulazi u lumen ER-a. Odatle idu preko Golgijeva aparata do lizosoma, stanične\nmembrane ili se izlučuju u sekrecijskim vezikulama (ili ostaju u ER-u/Golgiju).\n2. Smatanje proteina\nFunkcija proteina ovisi o njegovoj trodimenzionalnoj strukturi. Polipeptidni lanac mora se\npravilno smotati (primarna → sekundarna: α-uzvojnica i β-nabrana ploča →\ntercijarna/kvaterna struktura). Pogrešno smotani proteini nefunkcionalni su, a mogu\nstvarati toksične nakupine.\n2.1. Šaperoni\nŠaperoni su proteini koji stabiliziraju nesmotane ili djelomično smotane proteine i\npomažu im da se pravilno smotaju. Ne ulaze u konačnu strukturu proteina.\nKada djeluju:\n• Tijekom translacije: šaperon se veže na polipeptid koji izlazi iz ribosoma i sprječava\npogrešno savijanje dok lanac nije dovršen. Kad je polipeptid dovršen i otpušten,\nsmata se u svoj konačni oblik.\n• Tijekom prijenosa proteina do ciljnog odredišta: npr. za prijenos u mitohondrij\nprotein mora biti nesmotan da prođe kroz membranski kanal. Šaperoni citosola\nodržavaju ga nesmotanim, a mitohondrijski šaperoni unutar mitohondrija pomažu\nda se tamo smota.\nHsp70 i Hsp60 (primjer djelovanja jedan za drugim):\n1. Tijekom translacije nesmotani polipeptidni lanci vežu se i stabiliziraju na šaperone\nporodice Hsp70.\n2. Nakon otpuštanja iz ribosoma, djelomično smotani međuprodukt prenosi se na\nHsp60 (šaperonin: bačvasti kompleks).\n3. Smatanje se odvija unutar Hsp60 komore; za odvajanje od Hsp70 i smatanje unutar\nHsp60 troši se ATP (hidroliza ATP-a).\n(Hsp = heat shock proteins, proteini toplinskog šoka; stanica ih pojačano stvara u stresu.)\n2.2. Enzimi koji kataliziraju smatanje\nStanice imaju najmanje dvije vrste enzima koji ubrzavaju smatanje:\nProtein-disulfid-izomeraza (PDI)\n• katalizira stvaranje disulfidnih veza između cisteina,\n• važno za stabilizaciju proteina, osobito sekretornih proteina i nekih membranskih\nproteina (disulfidne veze nastaju u oksidirajućoj okolini ER-a).\nPeptidil-prolil-izomeraza (PPI)\n• katalizira izomerizaciju peptidnih veza u kojima sudjeluje prolin,\n• prolin je u ravnoteži između trans i cis konformacije peptidne veze, dok su peptidne\nveze između drugih aminokiselina uglavnom u trans obliku\n3. Dorada (obrada) proteina: posttranslacijske modifikacije\nNakon (ili za vrijeme) sinteze protein se kemijski modificira. Te modifikacije mijenjaju\nnjegovu aktivnost, smještaj i stabilnost. Na predavanju se navode:\nglikozilacija, amidacija, hidroksilacija, prenilacija, miristilacija, acetilacija, metilacija,\nfosforilacija i ubikvitinacija.\n3.1. Glikozilacija\nGlikoproteini su proteini na koje su vezani ugljikohidratni ostaci.\nVrsta Gdje se veže ugljikohidrat Primjer\nN-vezujuća za dušikov atom bočnog ogranka\nN-acetilglukozamin\nglikozilacija asparagina\nO-vezujuća za kisikov atom bočnog ogranka serina ili O-\nglikozilacija treonina acetilgalaktozamin\nVećina glikoproteina predodređena je za sekreciju ili ugradnju u staničnu membranu.\n(Glikozilacija se odvija u ER-u i Golgijevu aparatu.)\n3.2. Vezanje lipida na proteine\nOvim modifikacijama protein se usmjerava i usidri u staničnu membranu (lipoproteini):\n• N-miristilacija: miristinska kiselina (masna kiselina) veže se na N-terminalni\nglicin.\n• Prenilacija: vezanje izoprenoidnih lipida preko bočnih ogranaka (na predavanju:\ncisteina, serina i treonina; u literaturi je prenilacija tipično na cisteinu blizu C-kraja).\n• Palmitacija: palmitinska kiselina veže se na sumpor bočnog ogranka cisteina.\n4. Regulacija funkcije proteina\nAktivnost proteina može se regulirati na dvije razine:\n1. na razini ekspresije gena (koliko se proteina stvori: transkripcija, translacija),\n2. na razini funkcije proteina (količina i aktivnost gotovih proteinskih molekula) –\ntema ovog dijela.\nIsti protein može imati više funkcija i sudjelovati u više mreža interakcija\n4.1. Proenzim → enzim\nMnogi enzimi i hormoni sintetiziraju se kao neaktivni prekursori (proenzimi, zimogeni)\nkoji se aktiviraju tek kad je potrebno (npr. proteolitičkim cijepanjem). Aktivnost enzima\ndalje mijenjaju aktivatori i inhibitori: dostupnost supstrata, inhibicija produktom,\nalosterički aktivatori/inhibitori, konformacija aktivnog mjesta, pH (ispravna ili neispravna\nprotonacija) i kovalentne modifikacije.\n4.2. Ciljna proteoliza (proteolitička dorada)\n4.3. Interakcije protein–protein\nProteini surađuju vezanjem jedan na drugi: površina–lanac (surface–string), uzvojnica–\nuzvojnica (helix–helix) i površina–površina (surface–surface).\nAlosterička regulacija: regulatorna molekula veže se na mjesto na enzimu različito od\nkatalitičkog (aktivnog) mjesta te mijenja oblik, a time i aktivnost enzima.\n4.4. Regulacija kovalentnim vezama: fosforilacija\nFosforilacija je reverzibilna reakcija kojom se aktiviraju ili inhibiraju stanični proteini\nkao odgovor na signale iz okoline.\n• Protein-kinaze prenose fosfatnu skupinu s ATP-a na hidroksilne skupine bočnih\nogranaka serina, treonina i tirozina.\n• Protein-fosfataze hidroliziraju fosforilirani ostatak (Ser, Thr, Tyr) i vraćaju protein u\npočetno stanje.\nTaj „prekidač“ omogućuje brzo uključivanje i isključivanje proteina.\n4.5. Histonski kod\nModifikacije histona (metilacija, acetilacija, fosforilacija, ubikvitinacija na N-završecima\nhistona H2A, H2B, H3, H4) čine histonski kod koji određuje strukturu kromatina:\neukromatin (otvoren, aktivni geni) ili heterokromatin (zbijen, utišani geni). To je primjer\nregulacije aktivnosti proteina kovalentnim modifikacijama koja utječe na ekspresiju gena.\n5. Regulirana razgradnja proteina\nStanica kontrolira i koliko dugo protein živi. Razgradnja se odvija na dva glavna načina:\nubikvitin–proteasomski put i lizosomska proteoliza (autofagija).\n5.1. Ubikvitin–proteasomski put\nUbikvitin je mali protein koji služi kao proteinski biljeg za usmjeravanje citosolnih i\njezgrinih proteina na brzu proteolizu. To je glavni put selektivne razgradnje proteina u\neukariota.\nProteasom je proteazni kompleks u obliku bačve:\n• jezgra 20S (osnovno tijelo za razgradnju; sadrži proteazna mjesta),\n• regulatorni dio 19S (prepoznaje ubikvitinirani protein; ATPazni prsten ga odmata i\nuvodi u jezgru),\n• zajedno čine 26S proteasom.\nEnzimi koji vežu ubikvitin (kaskada E1–E2–E3):\nEnzim Uloga Broj vrsta u stanici\nE1 aktivira ubikvitin (uz ATP) jedna vrsta\nE2 konjugira (prenosi) ubikvitin nekoliko vrsta\nubikvitin-ligaza: bira ciljni protein i prenosi velik broj enzima (daje\nE3\nubikvitin na njega specifičnost)\nUbikvitin se veže na amino skupinu bočnog ogranka lizina proteina koji će se razgraditi;\nna protein se veže lanac ubikvitina (poliubikvitinacija).\nKoraci:\n1. protein za razgradnju,\n2. vezanje ubikvitina na ciljni protein,\n3. prepoznavanje od strane proteasoma,\n4. oslobađanje i recikliranje ubikvitina,\n5. hidroliza ciljnog proteina u kratke peptide.\nZašto je regulirana razgradnja važna? Primjer: ciklin B\nAktivnost nekih proteina ovisi upravo o tome da se u pravo vrijeme razgrade. Primjer je\nstanični ciklus:\n• Ciklin B je regulacijska podjedinica protein-kinaze Cdk – kompleks potiče ulazak u\nmitozu (kondenzacija kromatina, razgradnja jezgrine ovojnice).\n• Cdk aktivira ubikvitin-ligazu → ciklin B se razgrađuje u proteasomu.\n• Izlazak iz mitoze: razgradnjom ciklina B inaktivira se Cdk.\n5.2. Lizosomska proteoliza i autofagija\nDrugi put razgradnje je u lizosomima, koji sadrže hidrolitičke enzime. Proteini u lizosome\nstižu:\n• endocitozom (proteini izvan stanice/iz membrane),\n• autofagijom (vlastiti stanični sastojci).\nAutofagija je odgovor na stanično gladovanje: stanici osigurava razgradnju\nneesencijalnih proteina i organela te iskorištavanje vlastitih komponenti. Ima i važnu\nulogu u razvojnim procesima, npr. u metamorfozi kukaca.\nTijek autofagije\n1. Indukcija: gladovanje, hipoksija, reaktivni kisikovi spojevi (ROS), infekcija, lijekovi,\ntjelovježba (signalni putovi mTOR i AMPK).\n2. Fagofor: stvara se membrana koja obuhvaća sastojke (mitohondriji, unutarstanični\nsastojci, proteinski agregati).\n3. Stvaranje autofagosoma: dvostruka membrana zatvara teret (sudjeluju proteini\nATG i LC3-II).\n4. Fuzija autofagosoma s lizosomom → autolizosom.\n5. Razgradnja i recikliranje: hidrolaze razgrađuju teret, a produkti (aminokiseline,\nmasne kiseline...) vraćaju se u stanicu.\nVeza s bolestima:\n• u neurodegenerativnim bolestima nakupljaju se toksični proteini,\n• genetičke mutacije gena koji reguliraju autofagiju važne su za održavanje\nneuronalne homeostaze,\n• disregulacija autofagije vodeći je uzrok neurodegenerativnih bolesti u ljudskoj\npopulaciji (isto vrijedi za ljude i voćne mušice kao modelni organizam)"</script>
<script type="application/json" id="src-p20">"P20 – genska osnova mutacija\n1. Što je mutacija\nMutacija je promjena genetičkog materijala, odnosno promjena u redoslijedu nukleotida\nu DNA u usporedbi s referentnom DNA. Važne su za evoluciju, ali mogu biti i patogene\n(uzrok bolesti).\nPodjele mutacija\n• Kromosomske-genske\n• Somatske-germinativne\n• Spontane-inducirane\nGerminativne i somatske mutacije\nGerminativne Somatske\nu germinativnim stanicama u tjelesnim (somatskim)\nGdje nastaju\n(spermiji i jajne stanice) stanicama\nPrenose li se na\nDA NE\npotomstvo\nprosječno novorođenče ima oko organizam je mozaik (dio stanica\nPosljedica\n100 novih mutacija ima mutaciju, dio nema)\n2. Genske mutacije – pregled\n• Supstitucija baze (točkaste mutacije): tranzicija (purin ↔ purin ili pirimidin ↔\npirimidin, npr. C→T, A→G) i transverzija (purin ↔ pirimidin).\n• Frameshift mutacije (pomak okvira čitanja): insercija baza i delecija baza.\nSupstitucije baze (točkaste mutacije)\nNajbolja supstitucija: C u T – oko 30 % promjena („hot spot“). Uzrok: spontana\ndeaminacija metil-citozina u timin (5-metilcitozin se deaminacijom pretvara izravno u T,\nkoji stanica teško prepozna kao grešku).\nPrimjer: ahondroplazija (autosomno dominantna, učestalost oko 1 : 25 000)\n• uzrok je missense mutacija u genu FGFR3 (receptor za faktor rasta fibroblasta 3;\n4p16.3; na slajdu je označen kao „FGF3“),\n• najgrešća mutacija (99 %): 1138G>A, Gly380Arg,\n• poremećaj enhondralne osifikacije,\n• visina: muškarci oko 130 cm, žene oko 123 cm,\n• značajke: povećana lumbalna lordoza, kratki ekstremiteti, kifoza, brahidaktilija,\nrazmak između 3. i 4. prsta.\n3. Tipovi točkastih mutacija nastalih supstitucijom baze\n3.1. Missense mutacije („mutacije krivog smisla“)\nPromijenjen kodon kodira drugu aminokiselinu → promijenjen polipeptidni lanac. Dijele\nse na:\n• Konzervativna supstitucija: nova aminokiselina je slikih svojstava (npr. obje\nnepolarne ili obje nabijene) pa je učinak na protein obično malen.\n• Nekonzervativna supstitucija: nova aminokiselina ima drugačija svojstva (naboj,\nveličina, polarnost) → može ozbiljno narušiti strukturu i funkciju proteina.\n3.2. Nonsense mutacije („besmislene mutacije“)\nZamjena baze stvara STOP kodon (UAA, UAG, UGA) unutar gena → prijevremena\nterminacija translacije polipeptida. Posljedice:\n• skraćen mRNA transkript i besmisleno posredovan raspad (NMD, nonsense-\nmediated decay) – stanica razgrađuje takvu mRNA,\n• ako se skraćeni protein ipak stvori, ima pogrešno smatanje (misfolding).\nPrimjer: Holt-Oramov sindrom\n• nonsense mutacije u genu TBX5 (transkripcijski faktor T-box 5; 12q24.21),\n• učestalost oko 1 : 100 000, autosomno dominantno,\n• anomalije karpalnih kostiju, radijusa i palca i prirođene srčane greške (defekt\nseptuma atrija i/ili ventrikula),\n• značajke: palac s tri falange, hipoplazija/aplazija radijusa, fokomelija, amelija.\n3.3. Silent mutacije (sinonimne, „tihe“)\nZamjena jednog para baza (obično na trećoj poziciji kodona) koja ne mijenja\naminokiselinu jer je kod redundantan. Polipeptid je nepromijenjen.\nPrimjer: iz kodona za tirozin (UAU) zamjenom samo jedne baze nastaje 9 različitih\nkodona: UUU (Phe), UCU (Ser), UGU (Cys), CAU (His), AAU (Asn), GAU (Asp), UAC (Tyr –\ntiha mutacija) te UAA i UAG (stop – nonsense).\n4. Frameshift mutacije\nAdicija ili delecija baza koje nisu višekratnik broja 3 poremeti okvir čitanja mRNA. Svi\nkodoni nizvodno od mutacije se promijene, pa se u polipeptid ugrađuju pogrešne\naminokiseline, a mijenja se i položaj stop kodona (često se pojavi prerani stop kodon).\nKrvna grupa 0\nPosljedica je frameshift mutacije: alel I⁰ ima deleciju gvanina (G) na položaju 261 u genu\nza glikoziltransferazu, što dovodi do preuranjenog stop kodona i degradacije mRNA.\nInsercija (primjer)\nNormalno: Arg – Ile – Ser – Tyr – Gly – Pro – Asp (CGT ATA TCC TAT GCC CCT GAC). Nakon\ninsercije: CGT ATA TCT ATC CTA TGC CCC TGA → Arg – Ile – Ser – Ile – Leu – Cys – Pro – Stop.\nSlijed aminokiselina nakon mutacije je izmijenjen, a pojavljuje se prerani stop kodon.\nTay-Sachsov alel: insercija 4 nukleotida dovodi do pomaka okvira (frameshift). Bolest je\nvrlo rijetka (osim u Ashkenazi Židova: 1 : 3500), nasljeduje se autosomno recesivno;\noštećenja mozga, paraliza, smrt oko pete godine.\nDelecija (primjer)\nNormalno: Ile – Ile – Phe – Gly – Val (T ATC ATC TTT GGT GTT). Nakon delecije tri nukleotida\n(TTT): Ile – Ile – – Gly – Val.\nCistična fibroza – ΔF508 u genu CFTR: izgubljena je aminokiselina fenilalanin na\npoložaju 508. Delecija tri nukleotida ne mijenja okvir čitanja (nije frameshift): protein je\nsamo kraći za jednu aminokiselinu.\n5. Mutacije koje zahvaćaju veća područja DNA\n• Velika delecija gena → kraća mRNA i kratak nestabilan protein.\n• Delecija cijelog gena → gubitak mRNA i proteina.\n• Inverzije, translokacije i duplikacije zahvaćaju veća područja DNA (vidi predavanje\no kromosomskim mutacijama).\n6. Mutacije gena za hemoglobin (Hb)\n• Postoji oko 300 varijanti Hb, od toga oko 200 točkastih mutacija; mnoge ne\nometaju funkciju Hb.\n• Srpasta anemija – defektan HbS zbog točkaste mutacije u genu za hemoglobin (u\nβ-globinu: zamjena glutaminske kiseline valinom na 6. mjestu; opće znanje):\no „srpasti“ eritrociti uzrokuju kroničnu anemiju i oštećenje tkiva i organa,\no autosomno-recesivna bolest, najčešća u Africi (1 : 375; 1 : 12 nosilac) i na\nMediteranu.\n8. Dinamičke mutacije\nDinamičke mutacije su nestabilna ponavljanja tripleta nukleotida koja se povećavaju\n(ekspandiraju) pri prijenosu iz generacije u generaciju (u čovjeka je opisano oko 14 bolesti\ns nestabilnim ponavljanjem tripleta), npr.:\n• sindrom fragilnog X (CGG), Huntingtonova bolest (CAG), miotonična distrofija\n(CTG), Friedreichova ataksija (GAA), spinocerebelarne ataksije (SCA 1, 2, 3, 6, 7, 8,\n12), spinobulbarna mišićna atrofija, dentatorubralno-palidoluizijska atrofija i dr.\nSindrom fragilnog X\n• prevalencija: 1 : 4000 muškaraca, 1 : 8000 žena,\n• dinamička mutacija: produljenje broja tripleta CGG u polimorfnoj, nekodirajućoj\nregiji prvog eksona gena FMR1,\n• fragilno mjesto FRAXA: Xq27.3,\n9. Mutacije u nekodirajućoj DNA\nMutacije u nekodirajućoj DNA mogu:\n1. nemati učinka na fenotip\n2. utjecati na razinu genske ekspresije:\no mutacije u promotorskim i drugim regulatornim regijama (npr. fragilni X\nsindrom),\no mutacije prekrajanja (splicing): u visokokonzerviranim donorskim\nmjestima prekrajanja (GT) i primateljskim mjestima (AG).\n10. Mutacije mogu imati poželjan/zaštitni učinak\nCCR5-Δ32 mutacija štiti od infekcije virusom HIV-a jer je receptor koji HIV koristi za\nučazak u stanicu izmijenjen/nedostaje.\n11. Učestalost mutacija\n• frekvencija spontanih mutacija: oko 10⁻⁹ po paru baza po generaciji,\n• frekvencija induciranih mutacija: oko 10⁻⁷ po paru baza po generaciji,\n• procjena: 10⁻⁸ mutacija/bp/generaciji × 3×10⁹ bp/genomu ≈ 10–100 mutacija po\ngenomu po generaciji.\n12. Spontane mutacije\n12.1. Greške tijekom replikacije\n• formiranje pogrešnog para baza (npr. A–C),\n• spontana insercija ili delecija baza\n12.2. Kemijske promjene DNA\n• Depurinacija – spontana hidroliza N-glikozidne veze koja dovodi do gubitka\npurinske baze (nastaje apurinsko (AP) mjesto); ~10⁴ po stanici dnevno\n• Deaminacija – hidroliza baze kojom se uklanja amino skupina (npr. C → U, 5-metil-\nC → T); ~10² baza po stanici dnevno. Zbog nje pri replikaciji nastaje pogreška\n12.3. Tautomerizacija\nTautomeri su dva oblika iste molekule u ravnoteži. Rijetki tautomerni oblici baza sparuju se\ns pogrešnom dušikovom bazom:\n• keto/enol oblici (T i G): keto (C=O) → enol (C–OH),\n• amino/imino oblici (C i A): amino (NH₂) → imino (NH).\nNa primjeru: pogrešno sparivanje tijekom replikacije može dovesti do tranzicije T–A u C–G.\n13.1. Fizički mutageni (zračenje)\n• Neioniziraujuće zračenje: UV (osobito stvaranje pirimidinskih (timinskih) dimera;\nopće znanje).\n• Ioniziraujuće zračenje: X-zrake, atomsko, kozmičko.\nUčinci ioniziraujućeg zračenja:\n• dvostruki ili jednostruki prekid lanca (između šećera i fosfata) ili između šećera i\nbaza,\n• hidriranje baze (tranzicije i transverzije), nedostatak purinske baze, promjena baze\n(npr. deaminacija),\n• prekidanje vodikovih veza među bazama, dimerizacija, unakrsno povezivanje DNA i\nproteina.\nUčinak može biti izravan i neizravan (preko slobodnih radikala). Dvolančani lomovi se, za\nrazliku od jednolančanih, teško popravljaju te dovode do apoptoze i mutacija.\n13.2. Kemijski mutageni\n• Analozi baza – ugrađuju se u DNA umjesto baza.\n• Modifikatori baza – kemijski modificiraju baze.\n• Interkalirajući agensi – umeću se u DNA između baza (uzrokuju insercije/delecije).\nPrvi dokazi (povijest): 1942. Charlotte Auerbach uočila je sličnost između promjena\nizazvanih mustard plinom i promjena izazvanih zračenjem; 1961. prikazan je nalaz\nkromosomskih aberacija u osoba tretiranih mustard plinom; 1969. osnovano je\nEnvironmental Mutagen Society.\n13.3. Biološki mutageni – virusi\n• uzrokuju kromosomske aberacije (lomove, delecije, translokacije),\n• DNA i RNA virusi mogu uzrokovati genske mutacije (insercija dijelova virusnog\ngenoma u DNA domaćina mutira pogođene gene),\n• poseban značaj: uloga virusa u mutacijama povezanima s razvojem tumora.\n14. Teratogeni\nTeratogen je agens koji može uzrokovati ili povećati vjerojatnost prirođene mane.\n(Teratogeni djeluju u embrionalnom razvoju i ne moraju mijenjati DNA.)\nPrimjer: talidomid – lijek korišten u prvim mjesecima trudnoće protiv mučnine (60-ih\ngodina XX. st.); posljedica je fokomelija (skraćeni ekstremiteti), oko 10 000 djece s\ndeformitetima."</script>
